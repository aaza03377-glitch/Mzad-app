<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#332001" />
  <meta name="description" content="نظام إدارة المزاد والجلسات والبيعات والعملاء والمحافظ والتسويات والتقارير" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ركن الكهرم" />
  <link rel="manifest" href="manifest.webmanifest?v=13" />
  <link rel="apple-touch-icon" href="icon/rk-apple-touch-v12.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="icon/rk-favicon-v12.png" />
  <title>نظام إدارة المزاد PWA V13</title>
  <style>
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #0f766e;
  --primary-dark: #115e59;
  --primary-soft: #ccfbf1;
  --danger: #b91c1c;
  --danger-soft: #fee2e2;
  --warning: #b45309;
  --warning-soft: #fef3c7;
  --success: #15803d;
  --success-soft: #dcfce7;
  --info: #1d4ed8;
  --info-soft: #dbeafe;
  --shadow: 0 10px 30px rgba(15, 23, 42, .08);
  --radius: 18px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.app-shell { min-height: 100vh; }
.topbar {
  position: fixed;
  inset: 0 0 auto 0;
  height: 72px;
  background: #0f172a;
  color: white;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  z-index: 50;
  box-shadow: 0 5px 20px rgba(15, 23, 42, .22);
}
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-logo {
  width: 42px; height: 42px; border-radius: 13px;
  background: linear-gradient(135deg, #14b8a6, #0f766e);
  display: grid; place-items: center; font-weight: 800; overflow: hidden;
}
.brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand h1 { margin: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { color: #cbd5e1; }
.icon-btn {
  border: 0; background: rgba(255,255,255,.1); color: white;
  width: 42px; height: 42px; border-radius: 12px; font-size: 21px;
}

.sidebar {
  position: fixed;
  top: 72px; right: 0; bottom: 0;
  width: 250px;
  background: var(--surface);
  border-left: 1px solid var(--line);
  padding: 18px 12px;
  z-index: 45;
  display: flex; flex-direction: column;
  transition: transform .25s ease;
}
.sidebar nav { display: grid; gap: 7px; }
.nav-item {
  border: 0; background: transparent; color: #334155;
  display: flex; gap: 12px; align-items: center;
  padding: 13px 14px; border-radius: 13px; text-align: right;
}
.nav-item span { width: 25px; text-align: center; font-size: 19px; }
.nav-item:hover { background: var(--surface-soft); }
.nav-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.sidebar-footer { margin-top: auto; padding: 12px; color: var(--muted); border-top: 1px solid var(--line); }

.main-content { margin-right: 250px; padding: 96px 24px 40px; min-height: 100vh; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-head h2 { margin: 0 0 5px; font-size: 24px; }
.page-head p { margin: 0; color: var(--muted); }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

button.primary, button.secondary, button.danger, button.ghost {
  border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700;
}
button.primary { background: var(--primary); color: white; }
button.primary:hover { background: var(--primary-dark); }
button.secondary { background: #e2e8f0; color: #1e293b; }
button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--line); }
button.danger { background: var(--danger-soft); color: var(--danger); }
button.compact { padding: 9px 12px; white-space: nowrap; }
button:disabled { opacity: .5; cursor: not-allowed; }

.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
}
.metric-card { position: relative; overflow: hidden; }
.metric-card::after {
  content: ""; position: absolute; width: 95px; height: 95px; border-radius: 50%;
  background: var(--primary-soft); left: -35px; top: -35px; opacity: .65;
}
.metric-label { color: var(--muted); font-size: 14px; }
.metric-value { margin-top: 9px; font-size: 26px; font-weight: 800; }
.metric-note { margin-top: 7px; color: var(--muted); font-size: 12px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-title h3 { margin: 0; font-size: 18px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 720px; background: white; }
th, td { padding: 13px 12px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: #f8fafc; color: #475569; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
.empty { padding: 38px 18px; text-align: center; color: var(--muted); }

.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.muted { background: #e2e8f0; color: #475569; }

.session-card { display: flex; flex-direction: column; gap: 14px; }
.session-card .session-meta { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.session-card h3 { margin: 0 0 6px; }
.session-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.session-stats div { padding: 10px; background: var(--surface-soft); border-radius: 12px; }
.session-stats small { display: block; color: var(--muted); margin-bottom: 4px; }
.session-actions { display: flex; gap: 8px; margin-top: auto; }

.wallet-card { display: flex; flex-direction: column; gap: 12px; }
.wallet-icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); font-size: 22px; }
.wallet-balance { font-size: 28px; font-weight: 800; }
.wallet-summary { display: flex; gap: 8px; }
.wallet-summary > div { flex: 1; padding: 9px; border-radius: 11px; background: var(--surface-soft); }
.wallet-summary small { color: var(--muted); display: block; }

.customer-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.customer-main { min-width: 0; }
.customer-main h3 { margin: 0 0 4px; }
.customer-main p { margin: 0; color: var(--muted); }
.balance-box { text-align: left; }
.balance-box strong { display: block; font-size: 18px; }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-muted { color: var(--muted); }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.field { display: grid; gap: 7px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 700; color: #334155; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid #cbd5e1; background: white; color: var(--text);
  border-radius: 12px; padding: 12px 13px; outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
.field textarea { min-height: 85px; resize: vertical; }
.help { color: var(--muted); font-size: 12px; }
.preview-box { background: var(--surface-soft); border: 1px dashed #cbd5e1; border-radius: 14px; padding: 14px; }
.calc-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.calc-grid div { background: white; border: 1px solid var(--line); padding: 10px; border-radius: 11px; }
.calc-grid small { display: block; color: var(--muted); margin-bottom: 4px; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(15,23,42,.58);
  display: grid; place-items: center; padding: 18px;
}
.modal {
  width: min(760px, 100%); max-height: calc(100vh - 36px); overflow: auto;
  background: white; border-radius: 20px; box-shadow: 0 25px 70px rgba(15,23,42,.3);
}
.modal.small { width: min(500px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: white; z-index: 2; }
.modal-head h3 { margin: 0; }
.modal-body { padding: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: white; }
.close-btn { border: 0; background: #f1f5f9; width: 36px; height: 36px; border-radius: 10px; font-size: 20px; }

.toast-root { position: fixed; left: 18px; bottom: 18px; z-index: 200; display: grid; gap: 9px; }
.toast { min-width: 260px; max-width: 360px; background: #0f172a; color: white; padding: 13px 15px; border-radius: 12px; box-shadow: var(--shadow); animation: slideIn .2s ease; }
.toast.error { background: #991b1b; }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } }

.overlay { display: none; }
.mobile-only { display: none; }
.hidden { display: none !important; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.list { display: grid; gap: 10px; }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 13px; }
.list-row p, .list-row h4 { margin: 0; }
.list-row small { color: var(--muted); }

@media (max-width: 1050px) {
  .grid-4 { grid-template-columns: repeat(2,1fr); }
  .grid-3 { grid-template-columns: repeat(2,1fr); }
}

@media (max-width: 780px) {
  .topbar { padding: 0 12px; }
  .brand small { display: none; }
  .sidebar { transform: translateX(105%); width: min(82vw, 290px); }
  .sidebar.open { transform: translateX(0); }
  .overlay { position: fixed; inset: 72px 0 0 0; background: rgba(15,23,42,.4); z-index: 40; }
  .overlay.show { display: block; }
  .main-content { margin-right: 0; padding: 92px 14px 30px; }
  .page-head { align-items: flex-start; }
  .page-head h2 { font-size: 21px; }
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .calc-grid { grid-template-columns: 1fr; }
  .session-stats { grid-template-columns: 1fr 1fr; }
  .customer-card { align-items: flex-start; }
  .mobile-only { display: initial; }
}

@media (max-width: 480px) {
  .brand-logo { display: none; }
  .topbar .primary { font-size: 13px; padding: 9px 10px; }
  .metric-value { font-size: 22px; }
  .card { padding: 15px; }
  .page-head { flex-direction: column; }
  .page-head .actions { width: 100%; }
  .page-head .actions button { flex: 1; }
  .session-actions { flex-wrap: wrap; }
  .session-actions button { flex: 1; }
  .modal-backdrop { padding: 8px; }
  .modal { max-height: calc(100vh - 16px); border-radius: 16px; }
}

/* إضافات النسخة المبسطة V2 */
.session-card-wide { grid-column: span 1; }
.session-stats-expanded { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.session-stats-expanded div:last-child { grid-column: span 2; }
.session-detail-metrics { margin-bottom: 2px; }
.sales-table { min-width: 1180px; }
.sale-actions { max-width: 240px; }
button.danger.outline { background: transparent; border: 1px solid #fecaca; }
.inactive-row { opacity: .72; background: #f8fafc; }
.align-left { text-align: left; }
.customer-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.customer-actions { margin-top: 9px; justify-content: flex-end; }
.customer-picker { position: relative; }
.customer-suggestions {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  left: 0;
  z-index: 12;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 16px 38px rgba(15,23,42,.15);
  overflow: hidden;
  max-height: 245px;
  overflow-y: auto;
}
.customer-suggestions.show { display: block; }
.customer-suggestions button {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  padding: 11px 12px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  text-align: right;
}
.customer-suggestions button:last-child { border-bottom: 0; }
.customer-suggestions button:hover { background: var(--surface-soft); }
.customer-suggestions small { color: var(--muted); direction: ltr; }
.suggestion-empty { padding: 12px; color: var(--muted); font-size: 12px; }
.toggle-field {
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 12px;
}
.toggle-field > label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.toggle-field input[type="checkbox"] { width: auto; }
.field-group { grid-column: 1 / -1; }
.inner-grid { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 13px; border-radius: 14px; }
.calc-grid-6 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.delivery-settings { display: grid; gap: 10px; padding: 13px; background: var(--surface-soft); border-radius: 14px; }
.delivery-settings h4 { margin: 0 0 2px; }
.delivery-setting-row { display: grid; grid-template-columns: 1fr 150px; align-items: center; gap: 10px; }
.delivery-setting-row label { display: flex; align-items: center; gap: 8px; }
.delivery-setting-row input[type="checkbox"] { width: auto; }
.delivery-setting-row input[type="number"] { padding: 10px 11px; }
.file-button { display: block; text-align: center; border-radius: 12px; padding: 11px 16px; font-weight: 700; cursor: pointer; }
.selection-row { width: 100%; background: #fff; color: var(--text); cursor: pointer; }

@media (max-width: 1050px) {
  .session-stats-expanded { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .session-stats-expanded div:last-child { grid-column: auto; }
}

@media (max-width: 780px) {
  .session-stats-expanded { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .calc-grid-6 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .delivery-setting-row { grid-template-columns: 1fr 110px; }
  .balance-box { width: 100%; text-align: right; }
  .customer-card { flex-direction: column; }
  .customer-actions { justify-content: flex-start; }
}

@media (max-width: 480px) {
  .calc-grid-6 { grid-template-columns: 1fr; }
  .delivery-setting-row { grid-template-columns: 1fr; }
  .sale-actions { max-width: none; }
}

/* إضافات النسخة المبسطة V3: الدفع والتقارير */
.calc-grid-8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gateway-payment-preview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding: 12px;
  border: 1px solid #bfdbfe;
  border-radius: 13px;
  background: #eff6ff;
  margin-bottom: 7px;
}
.gateway-payment-preview > div { background: #fff; border-radius: 10px; padding: 10px; }
.gateway-payment-preview small { display: block; color: var(--muted); margin-bottom: 4px; }
.gateway-payment-preview strong { font-size: 15px; }

.report-controls { margin-bottom: 16px; }
.report-filter-grid { grid-template-columns: 1fr 1.4fr auto; align-items: end; }
.report-buttons .actions { flex-wrap: nowrap; }
.report-output { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.print-report { padding: 24px; background: #fff; color: #0f172a; }
.report-header {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 16px;
  align-items: center;
  padding-bottom: 18px;
  margin-bottom: 18px;
  border-bottom: 2px solid #0f766e;
}
.report-header img, .report-logo-fallback {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  object-fit: cover;
  border: 1px solid var(--line);
}
.report-logo-fallback { display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-dark); font-size: 27px; font-weight: 800; }
.report-header h1 { margin: 0 0 3px; font-size: 20px; }
.report-header h2 { margin: 0; font-size: 25px; }
.report-header p { margin: 5px 0 0; color: var(--muted); }
.report-date { text-align: left; color: var(--muted); font-size: 12px; }
.report-date strong { color: var(--text); }
.report-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-bottom: 20px; }
.report-metrics > div { border: 1px solid var(--line); border-radius: 12px; padding: 11px; background: #f8fafc; }
.report-metrics small, .report-metrics span { display: block; color: var(--muted); }
.report-metrics strong { display: block; font-size: 18px; margin: 5px 0 3px; }
.report-metrics span { font-size: 11px; }
.report-section-title { font-size: 18px; margin: 22px 0 10px; padding-right: 10px; border-right: 4px solid var(--primary); }
.report-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.report-table { min-width: 900px; font-size: 12px; }
.report-table th, .report-table td { padding: 9px 8px; vertical-align: top; }
.report-table small { color: var(--muted); }
.report-inactive-row { background: #f8fafc; color: #64748b; }
.report-empty { padding: 35px 16px; text-align: center; color: var(--muted); border: 1px dashed #cbd5e1; border-radius: 12px; }

@media (max-width: 1050px) {
  .calc-grid-8 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .report-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .report-filter-grid { grid-template-columns: 1fr 1fr; }
  .report-buttons { grid-column: 1 / -1; }
}

@media (max-width: 780px) {
  .report-filter-grid { grid-template-columns: 1fr; }
  .report-buttons { grid-column: auto; }
  .report-buttons .actions button { flex: 1; }
  .report-header { grid-template-columns: 54px 1fr; }
  .report-header img, .report-logo-fallback { width: 50px; height: 50px; }
  .report-date { grid-column: 1 / -1; text-align: right; }
  .print-report { padding: 15px; }
  .gateway-payment-preview { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .calc-grid-8, .report-metrics { grid-template-columns: 1fr; }
  .report-header h2 { font-size: 20px; }
}

@media print {
  @page { size: A4 landscape; margin: 9mm; }
  body.printing-report { background: #fff !important; }
  body.printing-report .topbar,
  body.printing-report .sidebar,
  body.printing-report .overlay,
  body.printing-report .page-head,
  body.printing-report .report-controls,
  body.printing-report .toast-root,
  body.printing-report #modalRoot { display: none !important; }
  body.printing-report .main-content { margin: 0 !important; padding: 0 !important; }
  body.printing-report .report-output { border: 0; border-radius: 0; box-shadow: none; overflow: visible; }
  body.printing-report .print-report { padding: 0; }
  body.printing-report .report-header { break-inside: avoid; }
  body.printing-report .report-metrics { grid-template-columns: repeat(4, 1fr); break-inside: avoid; }
  body.printing-report .report-table-wrap { overflow: visible; border-radius: 0; }
  body.printing-report .report-table { min-width: 0; width: 100%; font-size: 8.5pt; }
  body.printing-report .report-table th,
  body.printing-report .report-table td { padding: 5px 4px; }
  body.printing-report .report-table thead { display: table-header-group; }
  body.printing-report .report-table tr { break-inside: avoid; }
  body.printing-report .report-section-title { break-after: avoid; }
}

/* النسخة V4 — تجربة استخدام احترافية ومتجاوبة */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --surface-soft: #f7faf9;
  --text: #17232c;
  --muted: #687782;
  --line: #dfe7e5;
  --primary: #1d6f67;
  --primary-dark: #15574f;
  --primary-soft: #e3f2ef;
  --danger: #a83a3a;
  --danger-soft: #fbeaea;
  --warning: #98621b;
  --warning-soft: #fff4dc;
  --success: #26734c;
  --success-soft: #e6f5ec;
  --info: #386b91;
  --info-soft: #e8f1f7;
  --shadow: 0 12px 34px rgba(27, 47, 55, .07);
  --radius: 17px;
}

html, body { min-height: 100%; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-variant-numeric: tabular-nums; }
body.modal-open { overflow: hidden; }
.topbar { background: linear-gradient(115deg, #14272e, #1b3d41); box-shadow: 0 7px 26px rgba(19, 39, 46, .22); }
.icon-btn { display: grid; place-items: center; transition: background .2s ease, transform .2s ease; }
.icon-btn:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); }
.sidebar { box-shadow: -8px 0 30px rgba(23, 35, 44, .04); }
.nav-item { transition: .18s ease; }
.nav-item.active { box-shadow: inset -3px 0 0 var(--primary); }
.main-content { max-width: 1680px; margin-left: auto; transition: margin-right .25s ease; }
body.sidebar-collapsed .sidebar { transform: translateX(105%); }
body.sidebar-collapsed .main-content { margin-right: 0; }
.card { box-shadow: var(--shadow); }
.metric-card { border-top: 3px solid rgba(29,111,103,.35); }
button.primary, button.secondary, button.danger, button.ghost, .file-button { min-height: 42px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
button:not(:disabled):active { transform: translateY(1px); }
button.primary { box-shadow: 0 7px 16px rgba(29,111,103,.16); }
button.ghost:hover { background: var(--primary-soft); border-color: #bedbd5; }
.field input, .field select, .field textarea { min-height: 46px; transition: border-color .15s ease, box-shadow .15s ease; }
.field input[type="number"], .field input[inputmode="tel"], .field input[type="date"] { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.ltr-cell { direction: ltr; text-align: right; }

.modal { overflow: hidden; display: flex; flex-direction: column; }
.modal.wide { width: min(1120px, 100%); }
.modal-body { overflow: auto; flex: 1; }
.modal-head, .modal-foot { flex: 0 0 auto; }
.modal-head { background: rgba(255,255,255,.97); backdrop-filter: blur(8px); }
.modal-foot { background: rgba(255,255,255,.97); backdrop-filter: blur(8px); }
.sale-modal { height: min(94dvh, 940px); }
.sale-modal .modal-body { background: #f4f7f6; padding: 16px; }
.sale-form { display: grid; gap: 14px; }
.form-section { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 5px 18px rgba(24, 45, 52, .035); }
.form-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #edf1f0; }
.form-section-head > div { display: flex; align-items: center; gap: 9px; }
.form-section-head h4 { margin: 0; font-size: 16px; }
.form-section-head small { color: var(--muted); }
.step-chip { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; background: var(--primary-soft); color: var(--primary-dark); font-weight: 800; direction: ltr; }
.sale-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.parties-grid .field { grid-column: span 2; }
.help-block { margin: -3px 0 12px; color: var(--muted); font-size: 13px; line-height: 1.7; }
.sale-preview { border-style: solid; background: linear-gradient(145deg, #eff7f5, #f8fbfa); }
.sale-preview .calc-grid > div { min-height: 75px; }

.farqiya-rows { display: grid; gap: 10px; }
.farqiya-row { display: grid; grid-template-columns: 1.35fr 1fr .7fr 42px; gap: 10px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #f9fbfa; }
.icon-danger { width: 42px; height: 46px; border: 0; border-radius: 11px; background: var(--danger-soft); color: var(--danger); font-size: 22px; }
.inline-empty { padding: 16px; text-align: center; color: var(--muted); border: 1px dashed #cbd8d5; border-radius: 13px; background: #fbfcfc; }
.mini-line { display: grid; gap: 2px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.mini-line:last-child { border-bottom: 0; }
.mini-line small { color: var(--muted); }
.sales-table { min-width: 1480px; }

.policy-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.policy-card { display: grid; gap: 9px; border: 1px solid var(--line); border-radius: 14px; padding: 13px; background: var(--surface-soft); font-weight: 700; }
.policy-card select, .policy-card input { width: 100%; min-height: 43px; border: 1px solid #cbd8d5; border-radius: 10px; padding: 9px 11px; background: #fff; }
.reversal-layout { display: grid; gap: 14px; }
.reversal-preview { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.provider-settlements { background: linear-gradient(150deg, #fff, #f7fbfa); }
.provider-card { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
.provider-card h4 { margin: 5px 0; }
.provider-type { color: var(--primary); font-size: 12px; font-weight: 800; }
.provider-due { text-align: left; display: grid; justify-items: end; gap: 7px; }
.provider-due small { color: var(--muted); }
.provider-due strong { font-size: 20px; }

.delivery-setting-card { border: 1px solid var(--line); border-radius: 14px; padding: 13px; background: #fff; display: grid; gap: 12px; }
.delivery-toggle { display: flex !important; align-items: center; gap: 8px; font-size: 14px !important; }
.delivery-toggle input, .pickup-row input[type="checkbox"] { width: auto; min-height: auto; }
.pickup-row { border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; background: #fff; }

.session-stats-expanded { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.session-stats-expanded div:last-child { grid-column: auto; }
.page-head .actions { justify-content: flex-end; }

@media (max-width: 1180px) {
  .sidebar { transform: translateX(105%); width: min(84vw, 310px); }
  .sidebar.open { transform: translateX(0); }
  .overlay { position: fixed; inset: 72px 0 0; background: rgba(16, 31, 37, .42); z-index: 40; }
  .overlay.show { display: block; }
  .main-content, body.sidebar-collapsed .main-content { margin-right: 0; padding-right: 18px; padding-left: 18px; }
  .sale-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .parties-grid .field { grid-column: span 1; }
  .farqiya-row { grid-template-columns: 1fr 1fr .75fr 42px; }
}

@media (max-width: 820px) {
  .main-content { padding: 90px 13px 28px; }
  .modal-backdrop { padding: 8px; align-items: stretch; }
  .modal, .modal.wide, .modal.small { width: 100%; max-height: calc(100dvh - 16px); border-radius: 15px; }
  .sale-modal { height: calc(100dvh - 16px); }
  .sale-modal .modal-body { padding: 10px; }
  .form-section { padding: 13px; }
  .form-section-head { align-items: flex-start; }
  .form-section-head > small { display: none; }
  .sale-grid, .policy-grid { grid-template-columns: 1fr 1fr; }
  .farqiya-row { grid-template-columns: 1fr 1fr; padding-top: 14px; }
  .farqiya-row .farqiya-amount { grid-column: 1 / -1; }
  .farqiya-row .icon-danger { position: absolute; margin-top: -8px; left: 20px; width: 34px; height: 34px; min-height: 34px; }
  .farqiya-row { position: relative; }
  .reversal-preview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .provider-card { align-items: flex-start; }
}

@media (max-width: 560px) {
  .sale-grid, .policy-grid, .reversal-preview { grid-template-columns: 1fr; }
  .parties-grid .field { grid-column: auto; }
  .farqiya-row { grid-template-columns: 1fr; }
  .farqiya-row .farqiya-amount { grid-column: auto; }
  .modal-foot { display: grid; grid-template-columns: 1fr 1fr; }
  .modal-foot button { width: 100%; }
  .form-section-head { flex-wrap: wrap; }
  .provider-card { flex-direction: column; }
  .provider-due { width: 100%; justify-items: stretch; text-align: right; }
  .provider-due button { width: 100%; }
}

@media print {
  body.printing-delivery { background: #fff !important; }
  body.printing-delivery .topbar,
  body.printing-delivery .sidebar,
  body.printing-delivery .overlay,
  body.printing-delivery .main-content,
  body.printing-delivery .toast-root,
  body.printing-delivery .modal-head,
  body.printing-delivery .modal-foot { display: none !important; }
  body.printing-delivery #modalRoot,
  body.printing-delivery .modal-backdrop,
  body.printing-delivery .modal,
  body.printing-delivery .modal-body { position: static !important; display: block !important; width: 100% !important; max-height: none !important; overflow: visible !important; padding: 0 !important; margin: 0 !important; background: #fff !important; box-shadow: none !important; border-radius: 0 !important; }
  body.printing-delivery .print-report { padding: 0 !important; }
  body.printing-delivery .report-table { min-width: 0 !important; width: 100% !important; font-size: 10pt; }
  body.printing-delivery .report-table-wrap { overflow: visible !important; }
  body.printing-delivery .report-metrics { grid-template-columns: repeat(3, 1fr); }
}

/* =========================================================
   V5 — واجهة حديثة وتقارير رسمية وهوية عملاء مرنة
   ========================================================= */
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-soft: #f6f8fb;
  --surface-strong: #eef3f8;
  --text: #132033;
  --muted: #6b778c;
  --line: #dfe6ee;
  --primary: #3157d5;
  --primary-dark: #2445b4;
  --primary-soft: #e8edff;
  --accent: #0f9f8f;
  --accent-soft: #e3f7f4;
  --danger: #c53c4c;
  --danger-soft: #fff0f2;
  --warning: #b7791f;
  --warning-soft: #fff7e7;
  --success: #198754;
  --success-soft: #e9f7f0;
  --info: #2d6da3;
  --info-soft: #eaf4fb;
  --shadow: 0 14px 36px rgba(31, 49, 80, .08);
  --shadow-strong: 0 22px 60px rgba(31, 49, 80, .16);
  --radius: 20px;
}

body {
  background:
    radial-gradient(circle at 90% 0%, rgba(49,87,213,.08), transparent 28%),
    radial-gradient(circle at 10% 100%, rgba(15,159,143,.06), transparent 30%),
    var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  letter-spacing: .01em;
}

.topbar {
  height: 76px;
  background: linear-gradient(115deg, #16243a 0%, #20365d 60%, #274a78 100%);
  border-bottom: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 10px 30px rgba(20,35,58,.24);
  padding-inline: 20px;
}
.brand-logo {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  background: linear-gradient(145deg, #5f7cff, #2fc2b0);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px rgba(25,70,170,.28);
}
.brand h1 { font-size: 18px; letter-spacing: .01em; }
.brand small { color: rgba(255,255,255,.68); }
.icon-btn {
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
}

.sidebar {
  top: 76px;
  width: 264px;
  padding: 22px 14px;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(18px);
  border-left: 1px solid rgba(215,225,237,.9);
  box-shadow: -14px 0 45px rgba(36,55,85,.055);
}
.sidebar nav { gap: 9px; }
.nav-item {
  min-height: 48px;
  padding: 13px 15px;
  border-radius: 15px;
  color: #42516a;
  font-weight: 650;
}
.nav-item span {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: #f0f3f8;
  font-size: 16px;
}
.nav-item:hover { background: #f6f8fc; color: var(--primary); }
.nav-item.active {
  background: linear-gradient(115deg, var(--primary-soft), #edf7ff);
  color: var(--primary-dark);
  box-shadow: inset -4px 0 0 var(--primary), 0 8px 20px rgba(49,87,213,.08);
}
.nav-item.active span { background: white; color: var(--primary); box-shadow: 0 5px 13px rgba(49,87,213,.12); }
.sidebar-footer {
  border-top: 1px solid var(--line);
  background: var(--surface-soft);
  border-radius: 14px;
  margin: 14px 4px 0;
}

.main-content {
  margin-right: 264px;
  padding: 104px 28px 46px;
  max-width: 1740px;
}
.page-head {
  margin-bottom: 24px;
  padding: 4px 2px;
}
.page-head h2 {
  font-size: clamp(23px, 2.3vw, 31px);
  font-weight: 800;
  letter-spacing: -.02em;
}
.page-head p { font-size: 14px; line-height: 1.8; }

.card {
  border: 1px solid rgba(215,225,237,.88);
  box-shadow: var(--shadow);
  border-radius: var(--radius);
  padding: 20px;
  background: rgba(255,255,255,.97);
}
.card:hover { border-color: #d3deeb; }
.metric-card {
  border-top: 0;
  isolation: isolate;
  min-height: 135px;
}
.metric-card::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 5px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  border-radius: 20px 0 0 20px;
}
.metric-card::after {
  background: linear-gradient(145deg, rgba(49,87,213,.15), rgba(15,159,143,.08));
  width: 120px;
  height: 120px;
  left: -46px;
  top: -50px;
}
.metric-value { font-size: 28px; letter-spacing: -.025em; }

button.primary, button.secondary, button.danger, button.ghost, .file-button {
  min-height: 44px;
  border-radius: 13px;
  padding: 11px 17px;
  font-weight: 750;
  letter-spacing: .01em;
}
button.primary {
  background: linear-gradient(135deg, #365fe2, #294cc4);
  box-shadow: 0 9px 20px rgba(49,87,213,.22);
}
button.primary:hover { background: linear-gradient(135deg, #2f55d0, #213fab); transform: translateY(-1px); }
button.secondary { background: #eef2f7; color: #34435b; border: 1px solid #dce4ed; }
button.secondary:hover { background: #e5ebf3; }
button.ghost { border: 1px solid #d8e1ec; color: var(--primary); background: #fff; }
button.danger { border: 1px solid #f4ccd2; }

.table-wrap {
  border-radius: 16px;
  border: 1px solid #dce4ed;
  background: #fff;
  box-shadow: 0 7px 22px rgba(31,49,80,.035);
}
th {
  background: #f2f5f9;
  color: #4b5870;
  font-weight: 750;
  letter-spacing: .01em;
}
td { color: #233149; }
tbody tr:hover { background: #fafcff; }

.field { gap: 8px; }
.field label { color: #34435b; font-size: 13px; font-weight: 750; }
.field input, .field select, .field textarea {
  min-height: 48px;
  border: 1px solid #d5deea;
  border-radius: 13px;
  background: #fbfcfe;
  padding: 12px 14px;
  color: #17243a;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
}
.field input:hover, .field select:hover, .field textarea:hover { border-color: #bdc9d9; background: #fff; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: #5f7cff;
  background: #fff;
  box-shadow: 0 0 0 4px rgba(49,87,213,.11);
}
.field input:disabled { background: #eef2f6; color: #7c8799; cursor: not-allowed; }
.help { line-height: 1.65; }

.modal-backdrop {
  background: rgba(15,28,48,.58);
  backdrop-filter: blur(8px);
}
.modal {
  border: 1px solid rgba(255,255,255,.5);
  border-radius: 23px;
  box-shadow: var(--shadow-strong);
}
.modal-head {
  min-height: 68px;
  padding: 18px 22px;
  background: rgba(255,255,255,.96);
}
.modal-head h3 { font-size: 19px; }
.modal-body { padding: 20px; }
.modal-foot { padding: 16px 22px; box-shadow: 0 -8px 22px rgba(29,47,76,.045); }
.close-btn { background: #eef2f7; color: #42516a; }
.sale-modal { height: min(95dvh, 980px); }
.sale-modal .modal-body { background: #f1f4f8; }
.sale-form { gap: 16px; }
.form-section {
  border: 1px solid #dce4ee;
  border-radius: 19px;
  padding: 18px;
  box-shadow: 0 8px 25px rgba(31,49,80,.045);
}
.form-section-head {
  border-bottom: 1px solid #e9eef4;
  padding-bottom: 12px;
}
.form-section-head h4 { font-size: 17px; }
.step-chip {
  width: 32px;
  height: 32px;
  border-radius: 11px;
  background: linear-gradient(145deg, var(--primary-soft), #e8f7f5);
  color: var(--primary-dark);
  box-shadow: inset 0 0 0 1px rgba(49,87,213,.09);
}
.sale-primary-section { background: linear-gradient(145deg, #fff, #fbfcff); }
.identity-rule {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 13px;
  background: #f1f5ff;
  border: 1px solid #d9e2ff;
  color: #40537b;
  font-size: 13px;
  line-height: 1.7;
}
.number-affix {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: stretch;
}
.number-affix input { border-radius: 13px 0 0 13px !important; }
.number-affix span {
  min-width: 56px;
  display: grid;
  place-items: center;
  padding-inline: 10px;
  background: #edf2fb;
  color: #43516b;
  border: 1px solid #d5deea;
  border-left: 0;
  border-radius: 0 13px 13px 0;
  font-weight: 800;
  white-space: nowrap;
}
.phone-control {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}
.no-phone-check {
  min-height: 48px;
  display: flex !important;
  align-items: center;
  gap: 7px;
  padding: 0 11px;
  border: 1px solid #d5deea;
  border-radius: 12px;
  background: #f3f6fa;
  white-space: nowrap;
  font-size: 12px !important;
  cursor: pointer;
}
.no-phone-check input { width: 17px !important; min-height: auto !important; height: 17px; margin: 0; }
.customer-code-box {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border: 1px dashed #b7c5d7;
  border-radius: 13px;
  background: #f7f9fc;
}
.customer-code-box span { color: var(--muted); }
.customer-code-box strong { direction: ltr; }

.farqiya-row {
  grid-template-columns: 1.3fr 1.15fr .7fr 44px;
  background: linear-gradient(145deg, #fbfcfe, #f5f8fc);
  border-color: #dce4ee;
}
.sale-preview {
  background: linear-gradient(145deg, #edf2ff, #eef9f7);
  border-color: #d7e2f4;
}
.sale-preview .calc-grid > div {
  border: 1px solid rgba(196,210,229,.9);
  box-shadow: 0 4px 12px rgba(31,49,80,.035);
}
.sale-preview .calc-grid strong { font-size: 18px; }
.sale-preview .calc-grid span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }

.customer-card {
  background: linear-gradient(145deg, #fff, #fbfcff);
  border-color: #dce4ee;
}
.customer-card::before {
  content: "";
  width: 5px;
  align-self: stretch;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
}
.customer-main p { font-variant-numeric: tabular-nums; }
.wallet-card { background: linear-gradient(145deg, #fff, #fbfdff); }
.wallet-icon { background: linear-gradient(145deg, var(--primary-soft), var(--accent-soft)); color: var(--primary); }
.session-card { background: linear-gradient(145deg, #fff, #fbfcff); }
.session-stats div { border: 1px solid #e6ecf3; background: #f7f9fc; }

/* Report builder */
.report-controls { padding: 22px; }
.report-control-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  padding-bottom: 16px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.report-control-header h3 { margin: 0 0 5px; }
.report-control-header p { margin: 0; color: var(--muted); }
.report-options-panel {
  margin-top: 18px;
  padding: 16px;
  border: 1px solid #dce4ee;
  border-radius: 16px;
  background: #f7f9fc;
}
.report-options-title { font-weight: 800; margin-bottom: 12px; color: #34435b; }
.report-option-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; }
.report-option {
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border: 1px solid #dce4ee;
  border-radius: 12px;
  background: #fff;
  color: #42516a;
  cursor: pointer;
  user-select: none;
}
.report-option:has(input:checked) { border-color: #aebfff; background: #eef2ff; color: #2948ad; }
.report-option input { width: 17px; height: 17px; accent-color: var(--primary); }
.report-output { margin-top: 20px; }
.official-report {
  background: #fff;
  border: 1px solid #d8e0e9;
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 18px 50px rgba(31,49,80,.09);
}
.official-report-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  padding-bottom: 18px;
  margin-bottom: 18px;
  border-bottom: 3px double #75839a;
}
.report-brand-block { display: flex; align-items: center; gap: 15px; }
.report-brand-block img, .report-logo-fallback { width: 66px; height: 66px; border-radius: 12px; object-fit: cover; }
.report-logo-fallback { display: grid; place-items: center; background: #e9edf3; color: #24344d; font-size: 25px; font-weight: 800; }
.report-org-name { font-size: 14px; color: #5a6679; margin-bottom: 4px; }
.official-report-header h1 { margin: 0; font-size: 24px; color: #16243a; }

(function () {
  'use strict';

  const KEY = 'auction_simple_v1_data';

  function uid(prefix) {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  }

  function normalizePhone(value) {
    const arabic = '٠١٢٣٤٥٦٧٨٩';
    const persian = '۰۱۲۳۴۵۶۷۸۹';
    let phone = String(value || '').trim()
      .replace(/[٠-٩]/g, d => String(arabic.indexOf(d)))
      .replace(/[۰-۹]/g, d => String(persian.indexOf(d)))
      .replace(/\D/g, '');
    if (phone.startsWith('00')) phone = phone.slice(2);
    return phone;
  }

  function customerCodeFromIndex(index) {
    return `C-${String(index + 1).padStart(4, '0')}`;
  }

  function defaultState() {
    return {
      version: 13,
      settings: {
        auctionName: 'مزادي',
        currency: 'ر.ق',
        defaultCommissionType: 'percent',
        defaultCommissionValue: 5,
        defaultCommission: 5,
        gatewayFeeRate: 2.5,
        logo: '',
        deliveryMethods: {
          pickup: { enabled: true, label: 'استلام', fee: 0, providerName: '' },
          local: { enabled: true, label: 'توصيل محلي', fee: 0, providerName: 'شركة التوصيل المحلي' },
          international: { enabled: true, label: 'شحن دولي', fee: 0, providerName: 'شركة الشحن الدولي' }
        }
      },
      sessions: [],
      customers: [],
      sales: [],
      wallets: [
        { id: 'wallet_bank', name: 'تحويل بنكي', type: 'bank', openingBalance: 0 },
        { id: 'wallet_cash', name: 'نقدي', type: 'cash', openingBalance: 0 },
        { id: 'wallet_gateway', name: 'رابط بوابة دفع', type: 'gateway', openingBalance: 0 }
      ],
      walletTransactions: [],
      payments: [],
      nettings: [],
      saleReversals: [],
      customerAdjustments: []
    };
  }

  function dedupeCustomers(customers) {
    const unique = [];
    const phoneToCustomer = new Map();
    const idMap = new Map();
    const usedCodes = new Set();

    (Array.isArray(customers) ? customers : []).forEach((item, index) => {
      const customer = { ...item };
      customer.id = customer.id || uid('cus');
      customer.name = String(customer.name || '').trim() || `عميل ${index + 1}`;
      customer.phone = normalizePhone(customer.phone);
      customer.customerCode = String(customer.customerCode || '').trim();

      // العملاء بلا رقم لا يتم دمجهم؛ لكل واحد هوية داخلية مستقلة.
      if (!customer.phone) {
        let code = customer.customerCode || customerCodeFromIndex(index);
        let counter = index + 1;
        while (usedCodes.has(code)) {
          counter += 1;
          code = customerCodeFromIndex(counter);
        }
        customer.customerCode = code;
        usedCodes.add(code);
        idMap.set(customer.id, customer.id);
        unique.push(customer);
        return;
      }

      const existing = phoneToCustomer.get(customer.phone);
      if (existing) {
        idMap.set(customer.id, existing.id);
        if ((!existing.name || existing.name.startsWith('عميل ')) && customer.name) existing.name = customer.name;
      } else {
        phoneToCustomer.set(customer.phone, customer);
        idMap.set(customer.id, customer.id);
        unique.push(customer);
      }
    });

    return { customers: unique, idMap };
  }

  function normalize(raw) {
    const base = defaultState();
    const source = raw && typeof raw === 'object' ? raw : {};
    const delivery = source.settings?.deliveryMethods || {};
    const legacyDefaultCommission = Number(source.settings?.defaultCommission ?? base.settings.defaultCommission);
    const defaultCommissionType = source.settings?.defaultCommissionType === 'fixed' ? 'fixed' : 'percent';
    const defaultCommissionValue = Number(source.settings?.defaultCommissionValue != null
      ? source.settings.defaultCommissionValue
      : legacyDefaultCommission);
    const settings = {
      ...base.settings,
      ...(source.settings || {}),
      defaultCommissionType,
      defaultCommissionValue,
      defaultCommission: defaultCommissionType === 'percent' ? defaultCommissionValue : legacyDefaultCommission,
      deliveryMethods: {
        pickup: { ...base.settings.deliveryMethods.pickup, ...(delivery.pickup || {}) },
        local: { ...base.settings.deliveryMethods.local, ...(delivery.local || {}) },
        international: { ...base.settings.deliveryMethods.international, ...(delivery.international || {}) }
      }
    };

    const deduped = dedupeCustomers(source.customers);
    const mapId = id => deduped.idMap.get(id) || id;

    const sales = (Array.isArray(source.sales) ? source.sales : []).map(item => {
      const price = Number(item.price || 0);
      const deliveryFee = Number(item.deliveryFee || 0);
      let farqiyas = Array.isArray(item.farqiyas)
        ? item.farqiyas.map((entry, index) => ({
          id: entry.id || uid(`far${index + 1}`),
          payerId: mapId(entry.payerId || entry.customerId),
          amount: Number(entry.amount || 0)
        })).filter(entry => entry.payerId && entry.amount > 0)
        : [];
      if (!farqiyas.length && Number(item.farqiyaAmount || 0) > 0 && item.farqiyaPayerId) {
        farqiyas = [{ id: uid('far'), payerId: mapId(item.farqiyaPayerId), amount: Number(item.farqiyaAmount || 0) }];
      }
      const farqiyaAmount = farqiyas.reduce((sum, entry) => sum + Number(entry.amount || 0), 0);
      const paymentMethod = item.paymentMethod || 'bank';
      const gatewayFeeRate = Number(item.gatewayFeeRate != null ? item.gatewayFeeRate : settings.gatewayFeeRate || 0);
      const buyerBaseCharge = Math.max(0, price - farqiyaAmount + deliveryFee);
      const gatewayFeeAmount = item.gatewayFeeAmount != null
        ? Number(item.gatewayFeeAmount)
        : (paymentMethod === 'gateway' ? buyerBaseCharge * gatewayFeeRate / 100 : 0);

      const commissionType = item.commissionType === 'fixed' ? 'fixed' : 'percent';
      const commissionValue = Number(item.commissionValue != null
        ? item.commissionValue
        : (commissionType === 'fixed' ? item.commissionAmount : item.commissionRate || 0));
      const commissionAmount = item.commissionAmount != null
        ? Number(item.commissionAmount)
        : (commissionType === 'fixed' ? commissionValue : price * commissionValue / 100);

      return {
        ...item,
        sellerId: mapId(item.sellerId),
        buyerId: mapId(item.buyerId),
        farqiyas,
        farqiyaAmount,
        farqiyaPayerId: farqiyas[0]?.payerId || null,
        deliveryMethod: item.deliveryMethod || 'pickup',
        deliveryFee,
        paymentMethod,
        gatewayFeeRate,
        gatewayFeeAmount,
        buyerBaseCharge,
        buyerCharge: item.buyerCharge != null ? Number(item.buyerCharge) : buyerBaseCharge + gatewayFeeAmount,
        totalReceivable: item.totalReceivable != null ? Number(item.totalReceivable) : price + deliveryFee + gatewayFeeAmount,
        commissionType,
        commissionValue,
        commissionRate: commissionType === 'percent' ? commissionValue : 0,
        commissionFixed: commissionType === 'fixed' ? commissionValue : 0,
        commissionAmount,
        sellerNet: item.sellerNet != null ? Number(item.sellerNet) : Math.max(0, price - commissionAmount),
        status: item.status || 'active'
      };
    });

    return {
      ...base,
      ...source,
      version: 13,
      settings,
      sessions: Array.isArray(source.sessions) ? source.sessions : [],
      customers: deduped.customers,
      sales,
      wallets: Array.isArray(source.wallets) && source.wallets.length ? source.wallets : base.wallets,
      walletTransactions: Array.isArray(source.walletTransactions) ? source.walletTransactions : [],
      payments: (Array.isArray(source.payments) ? source.payments : []).map(p => ({
        ...p,
        customerId: p.customerId ? mapId(p.customerId) : null,
        walletAmount: p.walletAmount != null ? Number(p.walletAmount) : Number(p.amount || 0),
        gatewayFeeAmount: Number(p.gatewayFeeAmount || 0),
        gatewayFeeAllocations: Array.isArray(p.gatewayFeeAllocations) ? p.gatewayFeeAllocations : [],
        allocations: Array.isArray(p.allocations) ? p.allocations : []
      })),
      nettings: (Array.isArray(source.nettings) ? source.nettings : []).map(n => ({ ...n, customerId: mapId(n.customerId) })),
      saleReversals: (Array.isArray(source.saleReversals) ? source.saleReversals : []).map(r => ({
        ...r,
        refunds: (r.refunds || []).map(x => ({ ...x, customerId: x.customerId ? mapId(x.customerId) : null })),
        recoveries: (r.recoveries || []).map(x => ({ ...x, customerId: x.customerId ? mapId(x.customerId) : null })),
        retainedCommission: Number(r.retainedCommission || 0),
        retainedDelivery: Number(r.retainedDelivery || 0),
        retainedGatewayFee: Number(r.retainedGatewayFee || 0),
        customDeduction: Number(r.customDeduction || 0),
        outstandingBuyerCharge: Number(r.outstandingBuyerCharge || 0)
      })),
      customerAdjustments: (Array.isArray(source.customerAdjustments) ? source.customerAdjustments : []).map(a => ({
        ...a,
        customerId: mapId(a.customerId),
        amount: Number(a.amount || 0),
        settledAmount: Number(a.settledAmount || 0),
        status: a.status || 'active'
      }))
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? normalize(JSON.parse(raw)) : defaultState();
    } catch (error) {
      console.error('تعذر تحميل البيانات', error);
      return defaultState();
    }
  }

  function save(state) {
    localStorage.setItem(KEY, JSON.stringify(normalize(state)));
  }

  function reset() {
    const state = defaultState();
    save(state);
    return state;
  }

  window.AuctionStore = { KEY, uid, load, save, reset, defaultState, normalize, normalizePhone };
})();

</script>
  <script>
(function () {
  'use strict';

  const Store = window.AuctionStore;
  let state = Store.load();
  const UI_KEY = 'auction_simple_v4_ui';
  let savedUi = {};
  try { savedUi = JSON.parse(localStorage.getItem(UI_KEY) || '{}'); } catch (_) { savedUi = {}; }
  let currentView = savedUi.currentView || 'dashboard';
  let activeSessionId = savedUi.activeSessionId || null;

  const main = document.getElementById('mainContent');
  const modalRoot = document.getElementById('modalRoot');
  const toastRoot = document.getElementById('toastRoot');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  const esc = (value = '') => String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
  const num = value => Number(value || 0);
  const round = value => Math.round((num(value) + Number.EPSILON) * 100) / 100;
  const latinDigits = value => String(value ?? '').replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
  const numberText = value => new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(round(value));
  const money = value => `${numberText(value)} ${state.settings.currency}`;
  const dateText = value => { if (!value) return '—'; const d = new Date(`${value}T00:00:00`); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
  const dateTimeText = value => { if (!value) return '—'; const d = new Date(value); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const today = () => new Date().toISOString().slice(0, 10);
  const normalizePhone = value => Store.normalizePhone(value);
  const normalizeName = value => String(value || '').trim().replace(/\s+/g, ' ').toLowerCase();
  const isActiveSale = sale => (sale?.status || 'active') === 'active';

  function nextCustomerCode() {
    const max = state.customers.reduce((highest, customer) => {
      const match = String(customer.customerCode || '').match(/C-(\d+)/i);
      return Math.max(highest, match ? Number(match[1]) : 0);
    }, 0);
    return `C-${String(max + 1).padStart(4, '0')}`;
  }

  function customerContact(customer) {
    if (!customer) return '—';
    return customer.phone || `بدون رقم • ${customer.customerCode || 'هوية داخلية'}`;
  }

  function commissionAmountFor(price, type, value) {
    return round(type === 'fixed' ? value : num(price) * num(value) / 100);
  }

  function commissionDescription(sale) {
    const type = sale?.commissionType === 'fixed' ? 'fixed' : 'percent';
    const value = num(sale?.commissionValue != null ? sale.commissionValue : (type === 'fixed' ? sale?.commissionAmount : sale?.commissionRate));
    return type === 'fixed' ? `مبلغ ثابت ${money(value)}` : `نسبة ${numberText(value)}%`;
  }

  function persist(message) {
    state = Store.normalize(state);
    Store.save(state);
    updateBrand();
    if (message) toast(message);
  }

  function toast(message, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type === 'error' ? 'error' : ''}`;
    el.textContent = message;
    toastRoot.appendChild(el);
    setTimeout(() => el.remove(), 3400);
  }

  function updateBrand() {
    document.getElementById('brandName').textContent = state.settings.auctionName || 'مزادي';
    const logo = document.getElementById('brandLogo');
    if (state.settings.logo) logo.innerHTML = `<img src="${state.settings.logo}" alt="شعار المزاد">`;
    else logo.textContent = (state.settings.auctionName || 'م').trim().charAt(0) || 'م';
  }

  function setView(view, options = {}) {
    currentView = view;
    if (options.sessionId) activeSessionId = options.sessionId;
    if (view !== 'sessionDetails') activeSessionId = view === 'sessions' ? activeSessionId : null;
    if (currentView === 'sessionDetails' && !getSession(activeSessionId)) {
      currentView = 'sessions';
      activeSessionId = null;
    }
    localStorage.setItem(UI_KEY, JSON.stringify({ currentView, activeSessionId }));
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.view === (currentView === 'sessionDetails' ? 'sessions' : currentView)));
    closeSidebar();
    updateQuickSaleVisibility();
    render();
    if (!options.keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateQuickSaleVisibility() {
    document.getElementById('quickSaleBtn').classList.toggle('hidden', !['sessions', 'sessionDetails'].includes(currentView));
  }

  function openSidebar() {
    sidebar.classList.add('open');
    document.body.classList.remove('sidebar-collapsed');
    overlay.classList.add('show');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }

  function toggleSidebar() {
    if (window.matchMedia('(max-width: 1180px)').matches) {
      if (sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
    } else {
      document.body.classList.toggle('sidebar-collapsed');
    }
  }

  function modal({ title, body, footer = '', small = false, wide = false, className = '', onReady }) {
    modalRoot.innerHTML = `
      <div class="modal-backdrop" data-close-modal>
        <section class="modal ${small ? 'small' : ''} ${wide ? 'wide' : ''} ${esc(className)}" role="dialog" aria-modal="true">
          <div class="modal-head"><h3>${esc(title)}</h3><button class="close-btn" data-close-modal aria-label="إغلاق">×</button></div>
          <div class="modal-body">${body}</div>
          ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
        </section>
      </div>`;
    document.body.classList.add('modal-open');
    modalRoot.querySelector('.modal-backdrop').addEventListener('click', event => {
      if (event.target.matches('[data-close-modal]')) closeModal();
    });
    modalRoot.querySelectorAll('button[data-close-modal]').forEach(btn => btn.addEventListener('click', closeModal));
    if (onReady) onReady(modalRoot);
  }

  function closeModal() { modalRoot.innerHTML = ''; document.body.classList.remove('modal-open'); }

  function getSession(id) { return state.sessions.find(x => x.id === id); }
  function getCustomer(id) { return state.customers.find(x => x.id === id); }
  function getWallet(id) { return state.wallets.find(x => x.id === id); }
  function getSale(id) { return state.sales.find(x => x.id === id); }
  function salesForSession(id) { return state.sales.filter(x => x.sessionId === id); }
  function activeSalesForSession(id) { return salesForSession(id).filter(isActiveSale); }


  function saleFarqiyas(sale) {
    if (Array.isArray(sale?.farqiyas)) return sale.farqiyas.filter(item => num(item.amount) > 0 && item.payerId);
    return num(sale?.farqiyaAmount) > 0 && sale?.farqiyaPayerId ? [{ id: 'legacy', payerId: sale.farqiyaPayerId, amount: num(sale.farqiyaAmount) }] : [];
  }

  function saleFarqiyaTotal(sale) {
    return round(saleFarqiyas(sale).reduce((sum, item) => sum + num(item.amount), 0));
  }

  function getReversalForSale(saleId) {
    return state.saleReversals.find(item => item.saleId === saleId);
  }

  function adjustmentAllocated(adjustmentId) {
    const payments = state.payments.filter(payment => payment.kind === 'buyer_collection').reduce((sum, payment) => sum + (payment.allocations || []).filter(item => item.adjustmentId === adjustmentId).reduce((inner, item) => inner + num(item.amount), 0), 0);
    const nettings = state.nettings.reduce((sum, netting) => sum + (netting.buyerAllocations || []).filter(item => item.adjustmentId === adjustmentId).reduce((inner, item) => inner + num(item.amount), 0), 0);
    return round(payments + nettings);
  }

  function adjustmentDue(adjustment) {
    if (!adjustment || adjustment.status === 'cancelled') return 0;
    return Math.max(0, round(num(adjustment.amount) - num(adjustment.settledAmount) - adjustmentAllocated(adjustment.id)));
  }

  function customerAdjustmentDue(customerId) {
    return round(state.customerAdjustments.filter(item => item.customerId === customerId).reduce((sum, item) => sum + adjustmentDue(item), 0));
  }

  function walletBalance(walletId) {
    const wallet = getWallet(walletId);
    const tx = state.walletTransactions.filter(x => x.walletId === walletId);
    return round(num(wallet?.openingBalance) + tx.reduce((sum, item) => sum + (item.direction === 'in' ? num(item.amount) : -num(item.amount)), 0));
  }

  function allocationSum(items, saleId) {
    return round((items || []).filter(x => x.saleId === saleId).reduce((sum, x) => sum + num(x.amount), 0));
  }

  function buyerAllocated(saleId, customerId = null) {
    const payments = state.payments
      .filter(x => x.kind === 'buyer_collection' && (!customerId || x.customerId === customerId))
      .reduce((sum, x) => sum + allocationSum(x.allocations, saleId), 0);
    const nettings = state.nettings
      .filter(x => !customerId || x.customerId === customerId)
      .reduce((sum, x) => sum + allocationSum(x.buyerAllocations, saleId), 0);
    return round(payments + nettings);
  }

  function sellerAllocated(saleId) {
    const payments = state.payments
      .filter(x => x.kind === 'seller_payout')
      .reduce((sum, x) => sum + allocationSum(x.allocations, saleId), 0);
    const nettings = state.nettings.reduce((sum, x) => sum + allocationSum(x.sellerAllocations, saleId), 0);
    return round(payments + nettings);
  }

  function deliveryAllocated(saleId) {
    return round(state.payments.filter(payment => payment.kind === 'delivery_payout').reduce((sum, payment) => sum + allocationSum(payment.allocations, saleId), 0));
  }

  function deliveryObligationForSale(sale) {
    if (!sale || sale.deliveryMethod === 'pickup') return 0;
    if (isActiveSale(sale)) return num(sale.deliveryFee);
    const reversal = getReversalForSale(sale.id);
    return num(reversal?.retainedDelivery || 0);
  }

  function deliveryDueForSale(sale) {
    return Math.max(0, round(deliveryObligationForSale(sale) - deliveryAllocated(sale.id)));
  }

  function providerDue(deliveryMethod) {
    return round(state.sales.filter(sale => sale.deliveryMethod === deliveryMethod).reduce((sum, sale) => sum + deliveryDueForSale(sale), 0));
  }

  function providerSettled(deliveryMethod) {
    return round(state.sales.filter(sale => sale.deliveryMethod === deliveryMethod).reduce((sum, sale) => sum + Math.min(deliveryObligationForSale(sale), deliveryAllocated(sale.id)), 0));
  }


  function customerObligationForSale(sale, customerId) {
    if (!isActiveSale(sale)) return 0;
    let obligation = 0;
    if (sale.buyerId === customerId) obligation += num(sale.buyerCharge != null ? sale.buyerCharge : sale.price);
    saleFarqiyas(sale).filter(item => item.payerId === customerId).forEach(item => { obligation += num(item.amount); });
    return round(obligation);
  }

  function customerDueForSale(sale, customerId) {
    return Math.max(0, round(customerObligationForSale(sale, customerId) - buyerAllocated(sale.id, customerId)));
  }

  function saleCollected(sale) {
    if (!isActiveSale(sale)) return 0;
    const customerIds = [...new Set([sale.buyerId, ...saleFarqiyas(sale).map(item => item.payerId)].filter(Boolean))];
    return round(customerIds.reduce((sum, customerId) => sum + buyerAllocated(sale.id, customerId), 0));
  }

  function buyerDueForSale(sale) {
    if (!isActiveSale(sale)) return 0;
    return Math.max(0, round(num(sale.totalReceivable != null ? sale.totalReceivable : sale.price) - saleCollected(sale)));
  }

  function sellerEarnedForSale(sale) {
    if (!isActiveSale(sale)) return 0;
    const totalReceivable = Math.max(0, num(sale.totalReceivable != null ? sale.totalReceivable : sale.price));
    if (totalReceivable <= 0) return 0;
    const collectedRatio = Math.min(1, Math.max(0, saleCollected(sale) / totalReceivable));
    return round(num(sale.sellerNet) * collectedRatio);
  }

  function sellerDueForSale(sale) {
    if (!isActiveSale(sale)) return 0;
    return Math.max(0, round(sellerEarnedForSale(sale) - sellerAllocated(sale.id)));
  }

  function customerBuyerDue(customerId) {
    const salesDue = state.sales.reduce((sum, sale) => sum + customerDueForSale(sale, customerId), 0);
    return round(salesDue + customerAdjustmentDue(customerId));
  }

  function customerSellerDue(customerId) {
    return round(state.sales.filter(sale => sale.sellerId === customerId).reduce((sum, sale) => sum + sellerDueForSale(sale), 0));
  }

  function saleStatus(sale) {
    if (sale.status === 'returned') return { text: 'مرتجعة', cls: 'warning' };
    if (sale.status === 'cancelled') return { text: 'ملغاة', cls: 'muted' };
    const paid = saleCollected(sale);
    const total = num(sale.totalReceivable != null ? sale.totalReceivable : sale.price);
    if (paid <= 0) return { text: 'غير محصل', cls: 'danger' };
    if (paid + 0.001 >= total) return { text: 'محصلة', cls: 'success' };
    return { text: 'محصلة جزئياً', cls: 'warning' };
  }

  function deliveryConfig(type) {
    return state.settings.deliveryMethods?.[type] || { enabled: type === 'pickup', label: type, fee: 0 };
  }

  function deliveryLabel(type) { return deliveryConfig(type).label || type || 'استلام'; }

  function paymentMethodLabel(type) {
    return type === 'cash' ? 'نقدي' : type === 'gateway' ? 'رابط بوابة الدفع' : 'تحويل بنكي';
  }

  function paymentWalletId(type) {
    return type === 'cash' ? 'wallet_cash' : type === 'gateway' ? 'wallet_gateway' : 'wallet_bank';
  }

  function paymentMethodOptions(selected = 'bank') {
    return ['bank', 'cash', 'gateway'].map(type => `<option value="${type}" ${type === selected ? 'selected' : ''}>${paymentMethodLabel(type)}</option>`).join('');
  }

  function findCustomerByPhone(phone) {
    const normalized = normalizePhone(phone);
    if (!normalized) return null;
    return state.customers.find(customer => normalizePhone(customer.phone) === normalized) || null;
  }

  function resolveCustomer(name, phone, options = {}) {
    const cleanName = String(name || '').trim().replace(/\s+/g, ' ');
    const cleanPhone = normalizePhone(phone);
    const selected = options.selectedId ? getCustomer(options.selectedId) : null;
    if (!cleanName) throw new Error(`أدخل اسم ${options.roleLabel || 'العميل'}`);

    if (!cleanPhone) {
      if (!options.allowNoPhone) throw new Error(`أدخل رقم جوال ${options.roleLabel || 'العميل'} أو فعّل خيار بدون رقم`);
      if (selected && !selected.phone && normalizeName(selected.name) === normalizeName(cleanName)) return selected;
      const customer = { id: Store.uid('cus'), name: cleanName, phone: '', customerCode: nextCustomerCode(), createdAt: new Date().toISOString() };
      state.customers.push(customer);
      return customer;
    }

    if (cleanPhone.length < 6) throw new Error(`رقم جوال ${options.roleLabel || 'العميل'} غير صحيح`);
    const existing = findCustomerByPhone(cleanPhone);
    if (existing) {
      if (normalizeName(existing.name) !== normalizeName(cleanName)) {
        throw new Error(`رقم الجوال ${cleanPhone} مسجل باسم ${existing.name} ولا يمكن استخدامه باسم ${cleanName}`);
      }
      return existing;
    }
    const customer = { id: Store.uid('cus'), name: cleanName, phone: cleanPhone, customerCode: '', createdAt: new Date().toISOString() };
    state.customers.push(customer);
    return customer;
  }

  function validateSaleParticipants(participants) {
    const phones = new Map();
    participants.forEach(participant => {
      participant.name = String(participant.name || '').trim().replace(/\s+/g, ' ');
      participant.phone = normalizePhone(participant.phone);
      if (!participant.name) throw new Error(`أدخل اسم ${participant.roleLabel}`);
      if (!participant.phone && !participant.allowNoPhone) throw new Error(`أدخل رقم جوال ${participant.roleLabel} أو فعّل خيار بدون رقم`);
      if (participant.phone && participant.phone.length < 6) throw new Error(`رقم جوال ${participant.roleLabel} غير صحيح`);

      if (participant.phone) {
        const previous = phones.get(participant.phone);
        if (previous && normalizeName(previous.name) !== normalizeName(participant.name)) {
          throw new Error(`رقم الجوال ${participant.phone} مستخدم داخل البيعة باسمين مختلفين: ${previous.name} و${participant.name}`);
        }
        phones.set(participant.phone, participant);
        const existing = findCustomerByPhone(participant.phone);
        if (existing && normalizeName(existing.name) !== normalizeName(participant.name)) {
          throw new Error(`رقم الجوال ${participant.phone} مسجل مسبقاً باسم ${existing.name}`);
        }
      }
    });
  }

  function autoAllocate(kind, customerId, amount) {
    const relevant = state.sales
      .filter(isActiveSale)
      .filter(sale => kind === 'buyer_collection'
        ? customerObligationForSale(sale, customerId) > 0
        : sale.sellerId === customerId)
      .map(sale => ({ sale, due: kind === 'buyer_collection' ? customerDueForSale(sale, customerId) : sellerDueForSale(sale) }))
      .filter(x => x.due > 0)
      .sort((a, b) => new Date(a.sale.createdAt) - new Date(b.sale.createdAt));

    let remaining = round(amount);
    const allocations = [];
    relevant.forEach(item => {
      if (remaining <= 0) return;
      const allocated = Math.min(remaining, item.due);
      allocations.push({ saleId: item.sale.id, amount: round(allocated) });
      remaining = round(remaining - allocated);
    });

    if (kind === 'buyer_collection' && remaining > 0) {
      state.customerAdjustments
        .filter(item => item.customerId === customerId && adjustmentDue(item) > 0)
        .sort((a, b) => new Date(a.date || a.createdAt) - new Date(b.date || b.createdAt))
        .forEach(item => {
          if (remaining <= 0) return;
          const allocated = Math.min(remaining, adjustmentDue(item));
          allocations.push({ adjustmentId: item.id, amount: round(allocated) });
          remaining = round(remaining - allocated);
        });
    }
    return { allocations, remaining };
  }

  function addWalletTransaction({ walletId, direction, amount, description, refType, refId }) {
    state.walletTransactions.push({
      id: Store.uid('wtx'), walletId, direction, amount: round(amount), description,
      refType: refType || 'manual', refId: refId || '', date: new Date().toISOString()
    });
  }

  function pageHead(title, subtitle, actions = '') {
    return `<div class="page-head"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><div class="actions">${actions}</div></div>`;
  }

  function metric(label, value, note) {
    return `<div class="card metric-card"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div><div class="metric-note">${esc(note)}</div></div>`;
  }

  function empty(text) { return `<div class="empty">${esc(text)}</div>`; }
  function walletIcon(type) { return type === 'bank' ? '🏦' : type === 'cash' ? '💵' : '🔗'; }

  function render() {
    if (currentView === 'dashboard') renderDashboard();
    else if (currentView === 'sessions') renderSessions();
    else if (currentView === 'sessionDetails') renderSessionDetails();
    else if (currentView === 'customers') renderCustomers();
    else if (currentView === 'wallets') renderWallets();
    else if (currentView === 'settlements') renderSettlements();
    else if (currentView === 'reports') renderReports();
    else if (currentView === 'settings') renderSettings();
  }

  function renderDashboard() {
    const activeSales = state.sales.filter(isActiveSale);
    const totalSales = activeSales.reduce((sum, sale) => sum + num(sale.price), 0);
    const buyerDue = state.customers.reduce((sum, customer) => sum + customerBuyerDue(customer.id), 0);
    const sellerDue = state.customers.reduce((sum, customer) => sum + customerSellerDue(customer.id), 0);
    const walletsTotal = state.wallets.reduce((sum, wallet) => sum + walletBalance(wallet.id), 0);
    const recentSales = [...state.sales].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 6);

    main.innerHTML = `
      ${pageHead('لوحة التحكم', 'ملخص سريع لأهم أرقام المزاد')}
      <div class="grid grid-4">
        ${metric('إجمالي المبيعات', money(totalSales), `${activeSales.length} بيعة فعالة`)}
        ${metric('المطلوب من العملاء', money(buyerDue), 'يشمل المشترين ودافعي الفرقيات')}
        ${metric('مستحقات البائعين من المحصل', money(sellerDue), 'لا ينشأ استحقاق قبل التحصيل')}
        ${metric('إجمالي المحافظ', money(walletsTotal), `${state.wallets.length} محافظ`)}
      </div>
      <div class="grid grid-2" style="margin-top:16px">
        <section class="card">
          <div class="section-title"><h3>آخر البيعات</h3><button class="ghost compact" data-go-sessions>عرض الجلسات</button></div>
          ${recentSales.length ? `<div class="list">${recentSales.map(sale => {
            const buyer = getCustomer(sale.buyerId); const session = getSession(sale.sessionId); const st = saleStatus(sale);
            return `<div class="list-row"><div><h4>${esc(sale.item)}</h4><small>${esc(buyer?.name || '—')} • ${esc(session?.name || '—')}</small></div><div class="align-left"><strong>${money(sale.price)}</strong><br><span class="badge ${st.cls}">${st.text}</span></div></div>`;
          }).join('')}</div>` : empty('لا توجد بيعات حتى الآن')}
        </section>
        <section class="card">
          <div class="section-title"><h3>أرصدة المحافظ</h3><button class="ghost compact" data-go-wallets>إدارة المحافظ</button></div>
          <div class="list">${state.wallets.map(wallet => `<div class="list-row"><div><h4>${esc(wallet.name)}</h4><small>${walletIcon(wallet.type)} محفظة ${esc(wallet.name)}</small></div><strong>${money(walletBalance(wallet.id))}</strong></div>`).join('')}</div>
        </section>
      </div>`;

    main.querySelector('[data-go-sessions]')?.addEventListener('click', () => setView('sessions'));
    main.querySelector('[data-go-wallets]')?.addEventListener('click', () => setView('wallets'));
  }

  function sessionSummary(sessionId) {
    const sales = activeSalesForSession(sessionId);
    const reversed = salesForSession(sessionId).filter(sale => !isActiveSale(sale));
    const retainedCommission = reversed.reduce((sum, sale) => sum + num(getReversalForSale(sale.id)?.retainedCommission), 0);
    return {
      count: sales.length,
      total: round(sales.reduce((sum, sale) => sum + num(sale.price), 0)),
      collected: round(sales.reduce((sum, sale) => sum + saleCollected(sale), 0)),
      uncollected: round(sales.reduce((sum, sale) => sum + buyerDueForSale(sale), 0)),
      sellerDue: round(sales.reduce((sum, sale) => sum + sellerDueForSale(sale), 0)),
      sellerSettled: round(sales.reduce((sum, sale) => sum + sellerAllocated(sale.id), 0)),
      deliveryDue: round(salesForSession(sessionId).reduce((sum, sale) => sum + deliveryDueForSale(sale), 0)),
      deliverySettled: round(salesForSession(sessionId).reduce((sum, sale) => sum + Math.min(deliveryObligationForSale(sale), deliveryAllocated(sale.id)), 0)),
      commission: round(sales.reduce((sum, sale) => sum + num(sale.commissionAmount), 0) + retainedCommission)
    };
  }

  function renderSessions() {
    const sessions = [...state.sessions].sort((a, b) => new Date(b.date) - new Date(a.date));
    main.innerHTML = `
      ${pageHead('الجلسات', 'أنشئ جلسة وافتحها لتسجيل البيعات', '<button class="primary" id="newSession">+ جلسة جديدة</button>')}
      ${sessions.length ? `<div class="grid grid-2">${sessions.map(session => {
        const summary = sessionSummary(session.id);

          <div class="session-meta"><div><h3>${esc(session.name)}</h3><span class="text-muted">${dateText(session.date)}${reversedCount ? ` • ${reversedCount} ملغاة/مرتجعة` : ''}</span></div><span class="badge ${session.status === 'closed' ? 'muted' : 'success'}">${session.status === 'closed' ? 'مغلقة' : 'مفتوحة'}</span></div>

            <div><small>مستحق البائع من المحصل</small><strong>${money(summary.sellerDue)}</strong></div>
            <div><small>تمت تسوية البائع</small><strong class="text-success">${money(summary.sellerSettled)}</strong></div>

    modal({
      title: 'إنشاء جلسة جديدة', small: true,
      body: `<form id="sessionForm" class="form-grid"><div class="field full"><label>اسم الجلسة</label><input name="name" required maxlength="80" placeholder="مثال: مزاد الخميس" /></div><div class="field full"><label>تاريخ الجلسة</label><input type="date" name="date" required value="${today()}" /></div></form>`,
      footer: '<button class="secondary" data-close-modal>إلغاء</button><button class="primary" id="saveSession">إنشاء الجلسة</button>',
      onReady(root) {
        root.querySelector('#saveSession').addEventListener('click', () => {
          const form = root.querySelector('#sessionForm');
          if (!form.reportValidity()) return;
          const data = new FormData(form);
          state.sessions.push({ id: Store.uid('ses'), name: data.get('name').trim(), date: data.get('date'), status: 'open', createdAt: new Date().toISOString() });

  function toggleSession(id) {
    const session = getSession(id); if (!session) return;
    session.status = session.status === 'closed' ? 'open' : 'closed';
    persist(session.status === 'closed' ? 'تم إغلاق الجلسة' : 'تمت إعادة فتح الجلسة');
    renderSessions();
  }

  function deleteSession(id) {
    if (salesForSession(id).length) return toast('لا يمكن حذف جلسة تحتوي على بيعات أو سجل عمليات', 'error');
    if (!confirm('هل تريد حذف هذه الجلسة؟')) return;
    state.sessions = state.sessions.filter(x => x.id !== id);
    persist('تم حذف الجلسة'); renderSessions();
  }

    const rows = sales.map((sale, index) => {
      const buyer = getCustomer(sale.buyerId);

        <td>${money(buyerDueForSale(sale))}</td>

    return `<section class="print-report official-report delivery-official-report">
      ${reportHeader(serviceTitle, 'كشف تشغيلي رسمي بالطلبات المطلوب تنفيذها', { ...options, typeCode: method === 'international' ? 'SHIP' : 'DELIVERY' })}

      ${reportMetrics([
        { label: 'عدد الطلبات', value: numberText(sales.length) },
        { label: 'إجمالي رسوم الخدمة', value: money(totalFees), note: 'مستحق لطرف ثالث' },

        { label: 'إجمالي المتبقي على العملاء', value: money(totalDue) }
