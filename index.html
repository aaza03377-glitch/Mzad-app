  }

  function attachCustomerInputs(nameInput, phoneInput, suggestions, noPhoneToggle = null) {
    if (!nameInput || !phoneInput || !suggestions) return;
    function clearSelection() {
      delete nameInput.dataset.customerId;
      delete phoneInput.dataset.customerId;
    }
    function applyNoPhoneState(checked, preserveSelection = false) {
      phoneInput.disabled = checked;
      if (checked) phoneInput.value = '';
      if (!preserveSelection) clearSelection();
    }
    function select(customer) {
      if (!customer) return;
      nameInput.value = customer.name;
      phoneInput.value = customer.phone || '';
      nameInput.dataset.customerId = customer.id;
      phoneInput.dataset.customerId = customer.id;
      if (noPhoneToggle) {
        noPhoneToggle.checked = !customer.phone;
        applyNoPhoneState(noPhoneToggle.checked, true);
      }
      suggestions.innerHTML = '';
      suggestions.classList.remove('show');
    }
    function renderMatches(query) {
      const text = String(query || '').trim().toLowerCase();
      const phoneQuery = normalizePhone(query);
      if (!text && !phoneQuery) { suggestions.innerHTML = ''; suggestions.classList.remove('show'); return; }
      const matches = state.customers.filter(customer =>
        String(customer.name || '').toLowerCase().includes(text)
        || String(customer.customerCode || '').toLowerCase().includes(text)
        || (phoneQuery && normalizePhone(customer.phone).includes(phoneQuery))
      ).slice(0, 8);
      suggestions.innerHTML = matches.length
        ? matches.map(customer => `<button type="button" data-customer-id="${customer.id}"><strong>${esc(customer.name)}</strong><small>${esc(customerContact(customer))}</small></button>`).join('')
        : '<div class="suggestion-empty">لا يوجد تطابق — سيتم إنشاء العميل عند حفظ البيعة</div>';
      suggestions.classList.add('show');
      suggestions.querySelectorAll('[data-customer-id]').forEach(btn => btn.addEventListener('click', () => select(getCustomer(btn.dataset.customerId))));
    }
    nameInput.addEventListener('input', () => { clearSelection(); renderMatches(nameInput.value); });
    phoneInput.addEventListener('input', () => {
      clearSelection();
      const exact = findCustomerByPhone(phoneInput.value);
      const typedName = String(nameInput.value || '').trim();
      if (exact && typedName && normalizeName(typedName) !== normalizeName(exact.name)) {
        suggestions.innerHTML = `<div class="suggestion-conflict"><strong>تعارض في رقم الجوال</strong><span>الرقم مسجل باسم ${esc(exact.name)} ولا يمكن استخدامه باسم ${esc(typedName)}.</span></div>`;
        suggestions.classList.add('show');
      } else if (exact) select(exact);
      else renderMatches(phoneInput.value);
    });
    nameInput.addEventListener('focus', () => renderMatches(nameInput.value));
    phoneInput.addEventListener('focus', () => renderMatches(phoneInput.value));
    if (noPhoneToggle) {
      noPhoneToggle.addEventListener('change', () => applyNoPhoneState(noPhoneToggle.checked));
      applyNoPhoneState(noPhoneToggle.checked, true);
    }
  }

  function farqiyaRowMarkup(entry = {}, index = Date.now()) {
    const customer = entry.payerId ? getCustomer(entry.payerId) : null;
    const noPhone = customer && !customer.phone;
    return `<div class="farqiya-row" data-farqiya-row>
      <div class="field customer-picker"><label>صاحب الفرقية</label><input class="farqiya-name" value="${esc(customer?.name || entry.name || '')}" autocomplete="off" placeholder="الاسم أو الرقم أو الرمز" /><div class="customer-suggestions"></div></div>
      <div class="field phone-field"><label>رقم الجوال</label><div class="phone-control"><input class="farqiya-phone" inputmode="tel" value="${esc(customer?.phone || entry.phone || '')}" autocomplete="off" placeholder="رقم الجوال" ${noPhone ? 'disabled' : ''} /><label class="no-phone-check"><input class="farqiya-no-phone" type="checkbox" ${noPhone ? 'checked' : ''} /> بدون رقم</label></div></div>
      <div class="field"><label>قيمة الفرقية</label><input class="farqiya-amount" type="number" inputmode="decimal" min="0.01" step="0.01" value="${num(entry.amount) || ''}" placeholder="0" data-select-on-focus /></div>
      <button type="button" class="icon-danger remove-farqiya" aria-label="حذف صاحب الفرقية">×</button>
    </div>`;
  }

  function bindFarqiyaRow(row, onChange) {
    attachCustomerInputs(
      row.querySelector('.farqiya-name'),
      row.querySelector('.farqiya-phone'),
      row.querySelector('.customer-suggestions'),
      row.querySelector('.farqiya-no-phone')
    );
    row.querySelectorAll('input').forEach(input => input.addEventListener('input', onChange));
    row.querySelector('.remove-farqiya').addEventListener('click', () => { row.remove(); onChange(); });
  }

  function attachCustomerAutocomplete(root, prefix) {
    const form = root.querySelector('#saleForm');
    attachCustomerInputs(
      form.elements[`${prefix}Name`],
      form.elements[`${prefix}Phone`],
      root.querySelector(`#${prefix}Suggestions`),
      form.elements[`${prefix}NoPhone`]
    );
  }

  function deliveryOptions(selected) {
    const keys = ['pickup', 'local', 'international'];
    return keys.filter(key => deliveryConfig(key).enabled || key === selected)
      .map(key => `<option value="${key}" ${key === selected ? 'selected' : ''}>${esc(deliveryLabel(key))}</option>`).join('');
  }

  function openSaleForm(sessionId, saleId = null) {
    const sale = saleId ? getSale(saleId) : null;
    if (sale && !isActiveSale(sale)) return toast('لا يمكن تعديل بيعة ملغاة أو مرتجعة', 'error');
    if (sale && (buyerAllocated(sale.id) > 0 || sellerAllocated(sale.id) > 0 || deliveryAllocated(sale.id) > 0 || nettingAmountForSale(sale.id) > 0)) return toast('لا يمكن تعديل بيعة مرتبطة بحركة مالية. استخدم الإرجاع أو الإلغاء.', 'error');
    const seller = sale ? getCustomer(sale.sellerId) : null;
    const buyer = sale ? getCustomer(sale.buyerId) : null;
    const selectedDelivery = sale?.deliveryMethod || firstEnabledDeliveryMethod();
    const selectedPayment = sale?.paymentMethod || 'bank';
    const selectedCommissionType = sale?.commissionType === 'fixed' ? 'fixed' : (state.settings.defaultCommissionType === 'fixed' ? 'fixed' : 'percent');
    const selectedCommissionValue = sale
      ? num(sale.commissionValue != null ? sale.commissionValue : (selectedCommissionType === 'fixed' ? sale.commissionAmount : sale.commissionRate))
      : num(state.settings.defaultCommissionValue != null ? state.settings.defaultCommissionValue : state.settings.defaultCommission);
    const initialFarqiyas = saleFarqiyas(sale);

    modal({
      title: sale ? 'تعديل البيعة' : 'تسجيل بيعة جديدة',
      wide: true,
      className: 'sale-modal',
      body: `<form id="saleForm" class="sale-form">
        <section class="form-section sale-primary-section">
          <div class="form-section-head"><div><span class="step-chip">1</span><h4>بيانات البيعة</h4></div><small>السلعة والسعر وطريقة احتساب العمولة</small></div>
          <div class="form-grid sale-grid">
            <div class="field full"><label>وصف السلعة</label><input name="item" required maxlength="120" value="${esc(sale?.item || '')}" placeholder="مثال: مسباح كهرمان" /></div>
            <div class="field"><label>سعر البيع</label><input name="price" type="number" inputmode="decimal" min="0.01" step="0.01" required value="${sale ? num(sale.price) : ''}" data-select-on-focus /></div>
            <div class="field"><label>نوع عمولة المزاد</label><select name="commissionType"><option value="percent" ${selectedCommissionType === 'percent' ? 'selected' : ''}>نسبة مئوية</option><option value="fixed" ${selectedCommissionType === 'fixed' ? 'selected' : ''}>مبلغ ثابت</option></select></div>
            <div class="field"><label id="commissionValueLabel">قيمة العمولة</label><div class="number-affix"><input name="commissionValue" type="number" inputmode="decimal" min="0" step="0.01" required value="${selectedCommissionValue}" data-select-on-focus /><span id="commissionValueSuffix">%</span></div><small class="help" id="commissionValueHelp"></small></div>
          </div>
        </section>
        <section class="form-section">
          <div class="form-section-head"><div><span class="step-chip">2</span><h4>أطراف البيعة</h4></div><small>اختر عميلاً محفوظاً أو أدخل عميلاً جديداً</small></div>
          <div class="form-grid sale-grid parties-grid">${customerPicker('seller', 'اسم البائع', seller)}${customerPicker('buyer', 'اسم المشتري', buyer)}</div>
          <div class="identity-rule"><strong>قاعدة الهوية:</strong> لا يمكن استخدام رقم الجوال نفسه باسمين مختلفين. عند عدم توفر الرقم استخدم خيار «بدون رقم» وسيمنح النظام العميل رمزاً داخلياً.</div>
        </section>
        <section class="form-section">
          <div class="form-section-head"><div><span class="step-chip">3</span><h4>الدفع والتوصيل</h4></div><small>رسوم التوصيل مستحقات لطرف ثالث</small></div>
          <div class="form-grid sale-grid">
            <div class="field"><label>طريقة الدفع</label><select name="paymentMethod" required>${paymentMethodOptions(selectedPayment)}</select></div>
            <div id="gatewayRateField" class="field ${selectedPayment === 'gateway' ? '' : 'hidden'}"><label>عمولة بوابة الدفع %</label><input name="gatewayFeeRate" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="${sale ? num(sale.gatewayFeeRate) : num(state.settings.gatewayFeeRate)}" data-select-on-focus /><small class="help">تضاف على المشتري ولا تعد ربحاً للمزاد.</small></div>
            <div class="field"><label>طريقة الاستلام</label><select name="deliveryMethod" required>${deliveryOptions(selectedDelivery)}</select></div>
            <div class="field"><label>رسوم التوصيل / الشحن</label><input name="deliveryFee" type="number" inputmode="decimal" min="0" step="0.01" required value="${sale ? num(sale.deliveryFee) : num(deliveryConfig(selectedDelivery).fee)}" data-select-on-focus /></div>
          </div>
        </section>
        <section class="form-section farqiya-section">
          <div class="form-section-head"><div><span class="step-chip">4</span><h4>الفرقيات</h4></div><button type="button" class="secondary compact" id="addFarqiya">+ إضافة صاحب فرقية</button></div>
          <p class="help-block">يمكن إضافة أكثر من صاحب فرقية. لكل صاحب فرقية هوية مستقلة، ولا يقبل النظام رقماً واحداً باسمين مختلفين.</p>
          <div id="farqiyaRows" class="farqiya-rows">${initialFarqiyas.map((entry, index) => farqiyaRowMarkup(entry, index)).join('')}</div>
          <div id="noFarqiya" class="inline-empty ${initialFarqiyas.length ? 'hidden' : ''}">لا توجد فرقيات في هذه البيعة.</div>
        </section>
        <section class="form-section">
          <div class="form-section-head"><div><span class="step-chip">5</span><h4>الملاحظات والملخص</h4></div></div>
          <div class="field"><label>ملاحظات</label><textarea name="notes" placeholder="اختياري">${esc(sale?.notes || '')}</textarea></div>
          <div class="preview-box sale-preview"><div class="calc-grid calc-grid-8">
            <div><small>سعر البيع</small><strong id="calcPrice">${money(sale?.price || 0)}</strong></div>
            <div><small>مجموع الفرقيات</small><strong id="calcFarqiya">${money(saleFarqiyaTotal(sale))}</strong></div>
            <div><small>رسوم الطرف الثالث</small><strong id="calcDelivery">${money(sale?.deliveryFee || 0)}</strong></div>
            <div><small>رسوم البوابة</small><strong id="calcGateway">${money(sale?.gatewayFeeAmount || 0)}</strong></div>
            <div><small>على المشتري</small><strong id="calcBuyer">${money(sale?.buyerCharge || 0)}</strong></div>
            <div><small>عمولة المزاد</small><strong id="calcCommission">${money(sale?.commissionAmount || 0)}</strong><span id="calcCommissionType">${sale ? esc(commissionDescription(sale)) : ''}</span></div>
            <div><small>صافي البائع</small><strong id="calcSellerNet">${money(sale?.sellerNet || 0)}</strong></div>
            <div><small>إجمالي التحصيل</small><strong id="calcReceivable">${money(sale?.totalReceivable || 0)}</strong></div>
          </div></div>
        </section>
      </form>`,
      footer: `<button class="secondary" data-close-modal>إلغاء</button><button class="primary" id="saveSale">${sale ? 'حفظ التعديلات' : 'تسجيل البيعة'}</button>`,
      onReady(root) {
        const form = root.querySelector('#saleForm');
        const farqiyaRows = root.querySelector('#farqiyaRows');
        const noFarqiya = root.querySelector('#noFarqiya');
        const gatewayRateField = root.querySelector('#gatewayRateField');
        const commissionValueLabel = root.querySelector('#commissionValueLabel');
        const commissionValueSuffix = root.querySelector('#commissionValueSuffix');
        const commissionValueHelp = root.querySelector('#commissionValueHelp');
        attachCustomerAutocomplete(root, 'seller');
        attachCustomerAutocomplete(root, 'buyer');

        root.querySelectorAll('[data-select-on-focus]').forEach(input => {
          input.addEventListener('focus', () => requestAnimationFrame(() => input.select()));
        });

        function farqiyaTotal() {
          return round([...farqiyaRows.querySelectorAll('.farqiya-amount')].reduce((sum, input) => sum + num(input.value), 0));
        }
        function refreshFarqiyaEmpty() { noFarqiya.classList.toggle('hidden', farqiyaRows.children.length > 0); }
        function bindAllFarqiyas() {
          farqiyaRows.querySelectorAll('[data-farqiya-row]').forEach(row => {
            if (!row.dataset.bound) {
              row.dataset.bound = '1';
              bindFarqiyaRow(row, preview);
              row.querySelectorAll('[data-select-on-focus]').forEach(input => input.addEventListener('focus', () => requestAnimationFrame(() => input.select())));
            }
          });
          refreshFarqiyaEmpty();
        }
        function updateDeliveryFee() {
          const method = form.elements.deliveryMethod.value;
          form.elements.deliveryFee.value = method === 'pickup' ? 0 : num(deliveryConfig(method).fee);
          form.elements.deliveryFee.readOnly = method === 'pickup';
          preview();
        }
        function updatePaymentMethod() {
          const isGateway = form.elements.paymentMethod.value === 'gateway';
          gatewayRateField.classList.toggle('hidden', !isGateway);
          if (isGateway && !num(form.elements.gatewayFeeRate.value)) form.elements.gatewayFeeRate.value = num(state.settings.gatewayFeeRate);
          preview();
        }
        function updateCommissionMode() {
          const fixed = form.elements.commissionType.value === 'fixed';
          commissionValueLabel.textContent = fixed ? 'قيمة العمولة الثابتة' : 'نسبة العمولة';
          commissionValueSuffix.textContent = fixed ? state.settings.currency : '%';
          commissionValueHelp.textContent = fixed ? 'يُخصم هذا المبلغ مباشرة من سعر البيع.' : 'تُحسب العمولة كنسبة من سعر البيع.';
          if (fixed) form.elements.commissionValue.removeAttribute('max');
          else form.elements.commissionValue.max = '100';
          preview();
        }
        function preview() {
          const price = num(form.elements.price.value);
          const commissionType = form.elements.commissionType.value === 'fixed' ? 'fixed' : 'percent';
          const commissionValue = num(form.elements.commissionValue.value);
          const deliveryFee = num(form.elements.deliveryFee.value);
          const farqiyaAmount = farqiyaTotal();
          const paymentMethod = form.elements.paymentMethod.value;
          const gatewayFeeRate = paymentMethod === 'gateway' ? num(form.elements.gatewayFeeRate.value) : 0;
          const commission = commissionAmountFor(price, commissionType, commissionValue);
          const sellerNet = Math.max(0, round(price - commission));
          const buyerBaseCharge = Math.max(0, round(price - farqiyaAmount + deliveryFee));
          const gatewayFee = paymentMethod === 'gateway' ? round(buyerBaseCharge * gatewayFeeRate / 100) : 0;
          const buyerCharge = round(buyerBaseCharge + gatewayFee);
          const receivable = round(price + deliveryFee + gatewayFee);
          root.querySelector('#calcPrice').textContent = money(price);
          root.querySelector('#calcFarqiya').textContent = money(farqiyaAmount);
          root.querySelector('#calcDelivery').textContent = money(deliveryFee);
          root.querySelector('#calcGateway').textContent = money(gatewayFee);
          root.querySelector('#calcBuyer').textContent = money(buyerCharge);
          root.querySelector('#calcCommission').textContent = money(commission);
          root.querySelector('#calcCommissionType').textContent = commissionType === 'fixed' ? 'مبلغ ثابت' : `${numberText(commissionValue)}%`;
          root.querySelector('#calcSellerNet').textContent = money(sellerNet);
          root.querySelector('#calcReceivable').textContent = money(receivable);
        }

        root.querySelector('#addFarqiya').addEventListener('click', () => {
          farqiyaRows.insertAdjacentHTML('beforeend', farqiyaRowMarkup());
          bindAllFarqiyas(); preview();
          farqiyaRows.lastElementChild?.querySelector('.farqiya-name')?.focus();
        });
        form.elements.deliveryMethod.addEventListener('change', updateDeliveryFee);
        form.elements.paymentMethod.addEventListener('change', updatePaymentMethod);
        form.elements.commissionType.addEventListener('change', updateCommissionMode);
        ['price', 'commissionValue', 'deliveryFee', 'gatewayFeeRate'].forEach(name => form.elements[name]?.addEventListener('input', preview));
        form.elements.deliveryFee.readOnly = selectedDelivery === 'pickup';
        bindAllFarqiyas(); updatePaymentMethod(); updateCommissionMode(); preview();

        root.querySelector('#saveSale').addEventListener('click', () => {
          if (!form.reportValidity()) return;
          try {
            const fd = new FormData(form);
            const price = round(fd.get('price'));
            const commissionType = fd.get('commissionType') === 'fixed' ? 'fixed' : 'percent';
            const commissionValue = round(fd.get('commissionValue'));
            const commissionAmount = commissionAmountFor(price, commissionType, commissionValue);
            if (commissionType === 'percent' && commissionValue > 100) throw new Error('نسبة العمولة لا يمكن أن تتجاوز 100%');
            if (commissionAmount > price + 0.001) throw new Error('عمولة المزاد لا يمكن أن تتجاوز سعر البيع');

            const deliveryMethod = fd.get('deliveryMethod');
            const deliveryFee = deliveryMethod === 'pickup' ? 0 : round(fd.get('deliveryFee'));
            const paymentMethod = fd.get('paymentMethod');
            const gatewayFeeRate = paymentMethod === 'gateway' ? round(fd.get('gatewayFeeRate')) : 0;

            const sellerParticipant = {
              roleLabel: 'البائع', name: form.elements.sellerName.value, phone: form.elements.sellerPhone.value,
              allowNoPhone: form.elements.sellerNoPhone.checked,
              selectedId: form.elements.sellerName.dataset.customerId || form.elements.sellerPhone.dataset.customerId || ''
            };
            const buyerParticipant = {
              roleLabel: 'المشتري', name: form.elements.buyerName.value, phone: form.elements.buyerPhone.value,
              allowNoPhone: form.elements.buyerNoPhone.checked,
              selectedId: form.elements.buyerName.dataset.customerId || form.elements.buyerPhone.dataset.customerId || ''
            };
            const farqiyaParticipants = [];
            [...farqiyaRows.querySelectorAll('[data-farqiya-row]')].forEach((row, index) => {
              const amount = round(row.querySelector('.farqiya-amount').value);
              if (amount <= 0) return;
              farqiyaParticipants.push({
                roleLabel: `صاحب الفرقية رقم ${index + 1}`,
                name: row.querySelector('.farqiya-name').value,
                phone: row.querySelector('.farqiya-phone').value,
                allowNoPhone: row.querySelector('.farqiya-no-phone').checked,
                selectedId: row.querySelector('.farqiya-name').dataset.customerId || row.querySelector('.farqiya-phone').dataset.customerId || '',
                amount
              });
            });
            validateSaleParticipants([sellerParticipant, buyerParticipant, ...farqiyaParticipants]);

            const farqiyaAmountBeforeSave = round(farqiyaParticipants.reduce((sum, item) => sum + item.amount, 0));
            if (farqiyaAmountBeforeSave > price + 0.001) throw new Error('مجموع الفرقيات لا يمكن أن يتجاوز سعر البيع');

            const sellerCustomer = resolveCustomer(sellerParticipant.name, sellerParticipant.phone, sellerParticipant);
            const buyerCustomer = resolveCustomer(buyerParticipant.name, buyerParticipant.phone, buyerParticipant);
            const farqiyaMap = new Map();
            farqiyaParticipants.forEach(participant => {
              const payer = resolveCustomer(participant.name, participant.phone, participant);
              farqiyaMap.set(payer.id, round(num(farqiyaMap.get(payer.id)) + participant.amount));
            });
            const farqiyas = [...farqiyaMap.entries()].map(([payerId, amount]) => ({ id: Store.uid('far'), payerId, amount }));
            const farqiyaAmount = round(farqiyas.reduce((sum, entry) => sum + num(entry.amount), 0));
            const buyerBaseCharge = round(price - farqiyaAmount + deliveryFee);
            const gatewayFeeAmount = paymentMethod === 'gateway' ? round(buyerBaseCharge * gatewayFeeRate / 100) : 0;
            const payload = {
              sessionId, item: fd.get('item').trim(), sellerId: sellerCustomer.id, buyerId: buyerCustomer.id,
              price, commissionType, commissionValue,
              commissionRate: commissionType === 'percent' ? commissionValue : 0,
              commissionFixed: commissionType === 'fixed' ? commissionValue : 0,
              commissionAmount, sellerNet: round(price - commissionAmount),
              paymentMethod, gatewayFeeRate, gatewayFeeAmount, deliveryMethod, deliveryFee,
              farqiyas, farqiyaAmount, farqiyaPayerId: farqiyas[0]?.payerId || null,
              buyerBaseCharge, buyerCharge: round(buyerBaseCharge + gatewayFeeAmount),
              totalReceivable: round(price + deliveryFee + gatewayFeeAmount), notes: fd.get('notes').trim(), status: 'active'
            };
            if (sale) Object.assign(sale, payload, { updatedAt: new Date().toISOString() });
            else state.sales.push({ id: Store.uid('sale'), ...payload, createdAt: new Date().toISOString() });
            persist(sale ? 'تم تعديل البيعة' : 'تم تسجيل البيعة'); closeModal(); renderSessionDetails();
          } catch (error) { toast(error.message || 'تعذر حفظ البيعة', 'error'); }
        });
      }
    });
  }

  function firstEnabledDeliveryMethod() {
    return ['pickup', 'local', 'international'].find(key => deliveryConfig(key).enabled) || 'pickup';
  }

  function nettingAmountForSale(saleId) {
    return round(state.nettings.reduce((sum, netting) => sum + Math.max(allocationSum(netting.buyerAllocations, saleId), allocationSum(netting.sellerAllocations, saleId)), 0));
  }

  function saleHasFinancialLinks(saleId) {
    return buyerAllocated(saleId) > 0 || sellerAllocated(saleId) > 0 || deliveryAllocated(saleId) > 0 || nettingAmountForSale(saleId) > 0;
  }

  function deleteSale(id) {
    const sale = getSale(id); if (!sale) return;
    if (!isActiveSale(sale)) return toast('لا يمكن حذف سجل بيعة ملغاة أو مرتجعة', 'error');
    if (saleHasFinancialLinks(id)) return toast('البيعة مرتبطة بحركة مالية. استخدم الإرجاع أو الإلغاء ليتم عكسها بأمان.', 'error');
    if (!confirm('هل تريد حذف هذه البيعة نهائياً؟')) return;
    state.sales = state.sales.filter(x => x.id !== id);
    persist('تم حذف البيعة'); renderSessionDetails();
  }

  function getSaleFinancialLinks(saleId) {
    const refunds = [];
    const recoveries = [];
    state.payments.forEach(payment => {
      const amount = allocationSum(payment.allocations, saleId);
      if (amount <= 0) return;
      const gatewayFeeForSale = (payment.gatewayFeeAllocations || []).filter(x => x.saleId === saleId).reduce((sum, x) => sum + num(x.amount), 0);
      const item = {
        paymentId: payment.id, customerId: payment.customerId || null, walletId: payment.walletId, amount,
        walletAmount: payment.kind === 'buyer_collection' ? round(amount - gatewayFeeForSale) : amount,
        gatewayFeeAmount: gatewayFeeForSale, recoveryType: payment.kind === 'delivery_payout' ? 'delivery' : 'seller',
        providerType: payment.providerType || null
      };
      if (payment.kind === 'buyer_collection') refunds.push(item);
      else if (payment.kind === 'seller_payout' || payment.kind === 'delivery_payout') recoveries.push(item);
    });
    return { refunds, recoveries, nettingAmount: nettingAmountForSale(saleId) };
  }

  function groupByWallet(items) {
    const grouped = {};
    items.forEach(item => { grouped[item.walletId] = round(num(grouped[item.walletId]) + num(item.walletAmount != null ? item.walletAmount : item.amount)); });
    return grouped;
  }

  function removeAllocationAmount(list, targetSaleId, amount) {
    let remaining = round(amount);
    const copy = (list || []).map(item => ({ ...item, amount: num(item.amount) }));
    const consume = predicate => {
      copy.forEach(item => {
        if (remaining <= 0 || !predicate(item) || item.amount <= 0) return;
        const taken = Math.min(item.amount, remaining);
        item.amount = round(item.amount - taken);
        remaining = round(remaining - taken);
      });
    };
    consume(item => item.saleId === targetSaleId);
    consume(item => item.saleId !== targetSaleId);
    return copy.filter(item => item.amount > 0.001);
  }

  function unwindNettingsForSale(saleId) {
    let total = 0;
    state.nettings.forEach(netting => {
      const buyerAmount = allocationSum(netting.buyerAllocations, saleId);
      const sellerAmount = allocationSum(netting.sellerAllocations, saleId);
      const unwind = Math.max(buyerAmount, sellerAmount);
      if (unwind <= 0) return;
      netting.buyerAllocations = removeAllocationAmount(netting.buyerAllocations, saleId, unwind);
      netting.sellerAllocations = removeAllocationAmount(netting.sellerAllocations, saleId, unwind);
      netting.amount = Math.max(0, round(num(netting.amount) - unwind));
      total = round(total + unwind);
    });
    state.nettings = state.nettings.filter(netting => num(netting.amount) > 0.001);
    return total;
  }

  function distributeWalletRefund(items, targetAmount) {
    let remaining = round(targetAmount);
    return items.map(item => {
      const available = num(item.walletAmount);
      const refundAmount = Math.max(0, Math.min(available, remaining));
      remaining = round(remaining - refundAmount);
      return { ...item, amount: round(refundAmount), walletAmount: round(refundAmount) };
    }).filter(item => item.amount > 0.001);
  }

  function reverseSale(saleId, type) {
    const sale = getSale(saleId);
    if (!sale || !isActiveSale(sale)) return toast('هذه البيعة غير فعالة', 'error');
    const label = type === 'returned' ? 'إرجاع' : 'إلغاء';
    const links = getSaleFinancialLinks(saleId);
    modal({
      title: `${label} البيعة`,
      wide: true,
      className: 'reversal-modal',
      body: `<div class="reversal-layout">
        <section class="form-section"><div class="form-section-head"><div><h4>${esc(sale.item)}</h4></div><span class="badge info">${money(sale.price)}</span></div>
          <div class="policy-grid">
            <label class="policy-card"><span>عمولة المزاد ${money(sale.commissionAmount)}</span><select id="commissionPolicy"><option value="refund">إعفاء المشتري وإعادتها</option><option value="retain" selected>خصمها على المشتري</option></select></label>
            <label class="policy-card"><span>رسوم التوصيل ${money(sale.deliveryFee)}</span><select id="deliveryPolicy"><option value="refund" selected>إعادتها للمشتري</option><option value="retain">عدم إعادتها</option></select></label>
            <label class="policy-card"><span>رسوم بوابة الدفع ${money(sale.gatewayFeeAmount)}</span><select id="gatewayPolicy"><option value="retain" selected>غير مستردة</option><option value="refund">إعادتها للمشتري</option></select></label>
            <label class="policy-card"><span>خصم إضافي على المشتري</span><input id="customDeduction" type="number" inputmode="decimal" min="0" step="0.01" value="0" /></label>
          </div>
        </section>
        <section class="form-section"><div class="form-section-head"><div><h4>معاينة العملية</h4></div></div>
          <div class="reversal-preview calc-grid">
            <div><small>المحصل نقدياً من المشتري</small><strong id="revBuyerNet">${money(0)}</strong></div>
            <div><small>المبلغ الذي سيُرد للمشتري</small><strong id="revBuyerRefund">${money(0)}</strong></div>
            <div><small>رد أصحاب الفرقيات</small><strong id="revFarqiyaRefund">${money(0)}</strong></div>
            <div><small>المبلغ المحتفظ به</small><strong id="revRetained">${money(0)}</strong></div>
            <div><small>مبلغ يبقى مطلوباً من المشتري</small><strong id="revOutstanding">${money(0)}</strong></div>
            <div><small>استرداد تسويات الأطراف</small><strong id="revRecoveries">${money(0)}</strong></div>
          </div>
          <p class="help-block">إذا اخترت عدم إعادة رسوم التوصيل فستظل مستحقة لشركة التوصيل أو الشحن. جميع الحركات ستُسجل في كشوف الحساب والمحافظ.</p>
        </section>
      </div>`,
      footer: `<button class="secondary" data-close-modal>تراجع</button><button class="danger" id="confirmReversal">تأكيد ${label}</button>`,
      onReady(root) {
        const commissionPolicy = root.querySelector('#commissionPolicy');
        const deliveryPolicy = root.querySelector('#deliveryPolicy');
        const gatewayPolicy = root.querySelector('#gatewayPolicy');
        const customInput = root.querySelector('#customDeduction');
        let calculation = null;

        function calculate() {
          const buyerItems = links.refunds.filter(item => item.customerId === sale.buyerId);
          const otherItems = links.refunds.filter(item => item.customerId !== sale.buyerId);
          const buyerNet = round(buyerItems.reduce((sum, item) => sum + num(item.walletAmount), 0));
          const buyerGatewayCollected = round(buyerItems.reduce((sum, item) => sum + num(item.gatewayFeeAmount), 0));
          const retainedCommission = commissionPolicy.value === 'retain' ? num(sale.commissionAmount) : 0;
          const retainedDelivery = deliveryPolicy.value === 'retain' ? num(sale.deliveryFee) : 0;
          const customDeduction = Math.max(0, round(customInput.value));
          const retainedCore = round(retainedCommission + retainedDelivery + customDeduction);
          const retainedGatewayFee = gatewayPolicy.value === 'retain' ? buyerGatewayCollected : 0;
          const coreCovered = Math.min(buyerNet, retainedCore);
          const outstandingBuyerCharge = Math.max(0, round(retainedCore - buyerNet));
          const buyerRefundTarget = round(Math.max(0, buyerNet - retainedCore) + (gatewayPolicy.value === 'refund' ? buyerGatewayCollected : 0));
          let buyerRefunds = distributeWalletRefund(buyerItems, Math.min(buyerNet, Math.max(0, buyerNet - retainedCore)));
          if (gatewayPolicy.value === 'refund' && buyerGatewayCollected > 0) {
            const firstWallet = buyerItems[0]?.walletId || paymentWalletId(sale.paymentMethod);
            buyerRefunds.push({ paymentId: '', customerId: sale.buyerId, walletId: firstWallet, amount: buyerGatewayCollected, walletAmount: buyerGatewayCollected, gatewayFeeAmount: buyerGatewayCollected, source: 'gateway_refund' });
          }
          const otherRefunds = otherItems.map(item => ({ ...item, amount: num(item.walletAmount), walletAmount: num(item.walletAmount) })).filter(item => item.amount > 0.001);
          const recoveries = links.recoveries.filter(item => item.recoveryType !== 'delivery' || deliveryPolicy.value === 'refund');
          calculation = {
            buyerNet, buyerGatewayCollected, retainedCommission, retainedDelivery, retainedGatewayFee, customDeduction,
            retainedCore, coreCovered, outstandingBuyerCharge, buyerRefundTarget,
            refunds: [...buyerRefunds, ...otherRefunds], recoveries,
            farqiyaRefund: round(otherRefunds.reduce((sum, item) => sum + num(item.amount), 0))
          };
          root.querySelector('#revBuyerNet').textContent = money(buyerNet);
          root.querySelector('#revBuyerRefund').textContent = money(buyerRefundTarget);
          root.querySelector('#revFarqiyaRefund').textContent = money(calculation.farqiyaRefund);
          root.querySelector('#revRetained').textContent = money(retainedCore + retainedGatewayFee);
          root.querySelector('#revOutstanding').textContent = money(outstandingBuyerCharge);
          root.querySelector('#revRecoveries').textContent = money(recoveries.reduce((sum, item) => sum + num(item.walletAmount), 0));
        }
        [commissionPolicy, deliveryPolicy, gatewayPolicy].forEach(el => el.addEventListener('change', calculate));
        customInput.addEventListener('input', calculate);
        calculate();

        root.querySelector('#confirmReversal').addEventListener('click', () => {
          calculate();
          const refundByWallet = groupByWallet(calculation.refunds);
          const recoveryByWallet = groupByWallet(calculation.recoveries);
          for (const walletId of new Set([...Object.keys(refundByWallet), ...Object.keys(recoveryByWallet)])) {
            const availableAfterRecovery = round(walletBalance(walletId) + num(recoveryByWallet[walletId]));
            if (availableAfterRecovery + 0.001 < num(refundByWallet[walletId])) return toast(`رصيد محفظة ${getWallet(walletId)?.name || ''} غير كافٍ لتنفيذ الرد`, 'error');
          }
          const reversalId = Store.uid('rev');
          calculation.recoveries.forEach(item => addWalletTransaction({
            walletId: item.walletId, direction: 'in', amount: item.walletAmount,
            description: item.recoveryType === 'delivery' ? `استرداد تسوية شركة التوصيل بسبب ${label}: ${sale.item}` : `استرداد تسوية البائع بسبب ${label}: ${sale.item}`,
            refType: 'sale_reversal', refId: reversalId
          }));
          calculation.refunds.forEach(item => addWalletTransaction({
            walletId: item.walletId, direction: 'out', amount: item.walletAmount,
            description: `رد مبلغ للعميل بسبب ${label}: ${sale.item}`, refType: 'sale_reversal', refId: reversalId
          }));
          const unwound = unwindNettingsForSale(saleId);
          let adjustmentId = null;
          const adjustmentAmount = round(calculation.retainedCore + calculation.retainedGatewayFee);
          if (adjustmentAmount > 0) {
            adjustmentId = Store.uid('adj');
            state.customerAdjustments.push({
              id: adjustmentId, customerId: sale.buyerId, saleId, reversalId, amount: adjustmentAmount,
              settledAmount: round(calculation.coreCovered + calculation.retainedGatewayFee),
              description: `مبالغ محتفظ بها بسبب ${label} البيعة: ${sale.item}`, status: 'active', date: new Date().toISOString()
            });
          }
          state.saleReversals.push({
            id: reversalId, saleId, type, refunds: calculation.refunds, recoveries: calculation.recoveries,
            nettingAmount: unwound, retainedCommission: calculation.retainedCommission,
            retainedDelivery: calculation.retainedDelivery, retainedGatewayFee: calculation.retainedGatewayFee,
            customDeduction: calculation.customDeduction, outstandingBuyerCharge: calculation.outstandingBuyerCharge,
            buyerAdjustmentId: adjustmentId, date: new Date().toISOString()
          });
          sale.status = type; sale.reversalId = reversalId; sale.reversedAt = new Date().toISOString();
          persist(`تم ${label} البيعة وتسجيل جميع الآثار المالية`); closeModal(); renderSessionDetails();
        });
      }
    });
  }

  function openReversalDetails(saleId) {
    const sale = getSale(saleId);
    const reversal = getReversalForSale(saleId);
    if (!sale || !reversal) return toast('لا توجد تفاصيل عكس لهذه البيعة', 'error');
    const refundTotal = round((reversal.refunds || []).reduce((sum, item) => sum + num(item.amount), 0));
    const recoveryTotal = round((reversal.recoveries || []).reduce((sum, item) => sum + num(item.amount), 0));
    modal({
      title: sale.status === 'returned' ? 'تفاصيل إرجاع البيعة' : 'تفاصيل إلغاء البيعة', wide: true,
      body: `<div class="grid grid-3">${metric('المبلغ المردود للعملاء', money(refundTotal), 'الخارج من المحافظ')}${metric('المبالغ المستردة من الأطراف', money(recoveryTotal), 'البائع وشركات التوصيل')}${metric('المقاصة المفكوكة', money(reversal.nettingAmount), 'إعادة فتح الالتزامات')}</div>
        <div class="divider"></div><div class="list">
          <div class="list-row"><span>السلعة</span><strong>${esc(sale.item)}</strong></div>
          <div class="list-row"><span>عمولة المزاد المحتفظ بها</span><strong>${money(reversal.retainedCommission)}</strong></div>
          <div class="list-row"><span>رسوم التوصيل المحتفظ بها</span><strong>${money(reversal.retainedDelivery)}</strong></div>
          <div class="list-row"><span>رسوم البوابة غير المستردة</span><strong>${money(reversal.retainedGatewayFee)}</strong></div>
          <div class="list-row"><span>خصم إضافي</span><strong>${money(reversal.customDeduction)}</strong></div>
          <div class="list-row"><span>متبقٍ على المشتري بعد الإرجاع</span><strong>${money(reversal.outstandingBuyerCharge)}</strong></div>
          <div class="list-row"><span>تاريخ العملية</span><strong>${dateTimeText(reversal.date)}</strong></div>
        </div>`,
      footer: '<button class="secondary" data-close-modal>إغلاق</button>'
    });
  }

  function customerActivityStats(customerId) {
    const related = sale => sale.sellerId === customerId
      || sale.buyerId === customerId
      || saleFarqiyas(sale).some(entry => entry.payerId === customerId);
    return {
      sellerSales: state.sales.filter(sale => isActiveSale(sale) && sale.sellerId === customerId).length,
      buyerPurchases: state.sales.filter(sale => isActiveSale(sale) && sale.buyerId === customerId).length,
      farqiyas: state.sales.filter(isActiveSale).reduce((count, sale) => count + saleFarqiyas(sale).filter(entry => entry.payerId === customerId).length, 0),
      returns: state.sales.filter(sale => sale.status === 'returned' && related(sale)).length,
      cancellations: state.sales.filter(sale => sale.status === 'cancelled' && related(sale)).length
    };
  }

  function renderCustomers() {
    const customers = [...state.customers].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    main.innerHTML = `
      ${pageHead('العملاء', 'ابحث بالاسم أو رقم الجوال، وشاهد ملخص نشاط كل عميل مباشرة من بطاقته', '<button class="primary" id="newCustomer">+ إضافة عميل</button>')}
      ${customers.length ? `
        <section class="customer-toolbar card">
          <div class="customer-search-wrap">
            <span class="customer-search-icon" aria-hidden="true">⌕</span>
            <input id="customerSearch" type="search" inputmode="search" autocomplete="off" placeholder="ابحث باسم العميل أو رقم الجوال" aria-label="البحث عن عميل بالاسم أو رقم الجوال" />
            <button id="clearCustomerSearch" class="customer-search-clear hidden" type="button" aria-label="مسح البحث">×</button>
          </div>
          <div class="customer-results-count" id="customerResultsCount"></div>
        </section>
        <div id="customersCards"></div>
      ` : empty('سيظهر العملاء تلقائياً عند تسجيل أول بيعة، ويمكنك إضافتهم يدوياً.')}`;

    document.getElementById('newCustomer').addEventListener('click', () => openCustomerForm());
    if (!customers.length) return;

    const searchInput = document.getElementById('customerSearch');
    const clearSearch = document.getElementById('clearCustomerSearch');
    const cardsRoot = document.getElementById('customersCards');
    const resultsCount = document.getElementById('customerResultsCount');

    function bindCustomerActions() {
      cardsRoot.querySelectorAll('[data-ledger]').forEach(btn => btn.addEventListener('click', () => openCustomerLedger(btn.dataset.ledger)));
      cardsRoot.querySelectorAll('[data-edit-customer]').forEach(btn => btn.addEventListener('click', () => openCustomerForm(btn.dataset.editCustomer)));
    }

    function customerCard(customer) {
      const buyerDue = customerBuyerDue(customer.id);
      const sellerDue = customerSellerDue(customer.id);
      const net = round(sellerDue - buyerDue);
      const activity = customerActivityStats(customer.id);
      const initials = String(customer.name || 'ع').trim().split(/\s+/).slice(0, 2).map(part => part.charAt(0)).join('').slice(0, 2);
      return `<article class="card customer-card customer-summary-card">
        <div class="customer-card-head">
          <div class="customer-avatar" aria-hidden="true">${esc(initials || 'ع')}</div>
          <div class="customer-identity">
            <h3>${esc(customer.name)}</h3>
            <p class="customer-phone">${esc(customer.phone || 'بدون رقم جوال')}</p>
            ${customer.customerCode ? `<small class="customer-reference">الرمز: <b>${esc(customer.customerCode)}</b></small>` : ''}
          </div>
          <div class="customer-net-status">
            <small>صافي الرصيد</small>
            <strong class="${net > 0 ? 'text-success' : net < 0 ? 'text-danger' : 'text-muted'}">${net === 0 ? 'متوازن' : `${money(Math.abs(net))} ${net > 0 ? 'له' : 'عليه'}`}</strong>
          </div>
        </div>
        <div class="customer-activity-grid">
          <div class="customer-stat"><span>${numberText(activity.sellerSales)}</span><small>بيعاته</small></div>
          <div class="customer-stat"><span>${numberText(activity.buyerPurchases)}</span><small>مشترياته</small></div>
          <div class="customer-stat"><span>${numberText(activity.farqiyas)}</span><small>فرقياته</small></div>
          <div class="customer-stat return-stat"><span>${numberText(activity.returns)}</span><small>المرتجعات</small></div>
          <div class="customer-stat cancel-stat"><span>${numberText(activity.cancellations)}</span><small>الإلغاءات</small></div>
        </div>
        <div class="customer-card-foot">
          <div class="customer-financial-snapshot">
            <span class="customer-due-pill danger"><small>عليه</small><b>${money(buyerDue)}</b></span>
            <span class="customer-due-pill success"><small>له</small><b>${money(sellerDue)}</b></span>
          </div>
          <div class="actions customer-actions">
            <button class="ghost compact" data-ledger="${customer.id}">كشف الحساب</button>
            <button class="secondary compact" data-edit-customer="${customer.id}">تعديل</button>
          </div>
        </div>
      </article>`;
    }

    function applyCustomerSearch() {
      const raw = latinDigits(searchInput.value || '').trim();
      const nameQuery = normalizeName(raw);
      const phoneQuery = normalizePhone(raw);
      const filtered = customers.filter(customer => {
        if (!raw) return true;
        return normalizeName(customer.name).includes(nameQuery)
          || (phoneQuery && normalizePhone(customer.phone).includes(phoneQuery))
          || String(customer.customerCode || '').toLowerCase().includes(raw.toLowerCase());
      });
      clearSearch.classList.toggle('hidden', !raw);
      resultsCount.textContent = raw
        ? `تم العثور على ${numberText(filtered.length)} من أصل ${numberText(customers.length)} عميل`
        : `إجمالي العملاء: ${numberText(customers.length)}`;
      cardsRoot.innerHTML = filtered.length
        ? `<div class="customer-cards-grid">${filtered.map(customerCard).join('')}</div>`
        : `<div class="customer-no-results"><strong>لا توجد نتائج مطابقة</strong><span>جرّب كتابة جزء من الاسم أو رقم الجوال.</span></div>`;
      bindCustomerActions();
    }

    searchInput.addEventListener('input', applyCustomerSearch);
    clearSearch.addEventListener('click', () => { searchInput.value = ''; applyCustomerSearch(); searchInput.focus(); });
    applyCustomerSearch();
  }

  function openCustomerForm(customerId = null) {
    const customer = customerId ? getCustomer(customerId) : null;
    const startsWithoutPhone = Boolean(customer && !customer.phone);
    modal({
      title: customer ? 'تعديل بيانات العميل' : 'إضافة عميل', small: true,
      body: `<form id="customerForm" class="form-grid">
        <div class="field full"><label>اسم العميل</label><input name="name" required value="${esc(customer?.name || '')}" /></div>
        <div class="field full"><label>رقم الجوال</label><div class="phone-control"><input name="phone" inputmode="tel" value="${esc(customer?.phone || '')}" ${startsWithoutPhone ? 'disabled' : ''} /><label class="no-phone-check"><input name="noPhone" type="checkbox" ${startsWithoutPhone ? 'checked' : ''} /> بدون رقم</label></div><small class="help">لا يمكن استخدام الرقم نفسه باسم عميل مختلف. العميل بلا رقم يحصل على رمز داخلي مستقل.</small></div>
        ${customer?.customerCode ? `<div class="customer-code-box"><span>الرمز المرجعي</span><strong>${esc(customer.customerCode)}</strong></div>` : ''}
      </form>`,
      footer: '<button class="secondary" data-close-modal>إلغاء</button><button class="primary" id="saveCustomer">حفظ</button>',
      onReady(root) {
        const form = root.querySelector('#customerForm');
        const phoneInput = form.elements.phone;
        const noPhoneToggle = form.elements.noPhone;
        noPhoneToggle.addEventListener('change', () => {
          phoneInput.disabled = noPhoneToggle.checked;
          if (noPhoneToggle.checked) phoneInput.value = '';
          else phoneInput.focus();
        });
        root.querySelector('#saveCustomer').addEventListener('click', () => {
          if (!form.reportValidity()) return;
          const name = String(form.elements.name.value || '').trim().replace(/\s+/g, ' ');
          const phone = noPhoneToggle.checked ? '' : normalizePhone(phoneInput.value);
          if (!name) return toast('أدخل اسم العميل', 'error');
          if (phone && phone.length < 6) return toast('أدخل رقم جوال صحيحاً', 'error');
          if (!phone && !noPhoneToggle.checked) return toast('أدخل رقم الجوال أو فعّل خيار بدون رقم', 'error');
          const duplicate = phone ? state.customers.find(item => normalizePhone(item.phone) === phone && item.id !== customer?.id) : null;
          if (duplicate) return toast(`رقم الجوال مسجل مسبقاً باسم ${duplicate.name}`, 'error');
          if (customer) {
            Object.assign(customer, {
              name,
              phone,
              customerCode: phone ? customer.customerCode || '' : customer.customerCode || nextCustomerCode(),
              updatedAt: new Date().toISOString()
            });
          } else {
            state.customers.push({ id: Store.uid('cus'), name, phone, customerCode: phone ? '' : nextCustomerCode(), createdAt: new Date().toISOString() });
          }
          persist(customer ? 'تم تعديل بيانات العميل' : 'تمت إضافة العميل'); closeModal(); renderCustomers();
        });
      }
    });
  }

  function customerLedger(customerId) {
    const entries = [];
    state.sales.forEach(sale => {
      const suffix = sale.status === 'returned' ? ' (مرتجعة)' : sale.status === 'cancelled' ? ' (ملغاة)' : '';
      if (sale.buyerId === customerId) entries.push({ date: sale.createdAt, label: `شراء: ${sale.item}${suffix}`, debit: num(sale.buyerCharge), credit: 0, session: getSession(sale.sessionId)?.name || '' });
      saleFarqiyas(sale).filter(item => item.payerId === customerId).forEach(item => entries.push({ date: sale.createdAt, label: `فرقية: ${sale.item}${suffix}`, debit: num(item.amount), credit: 0, session: getSession(sale.sessionId)?.name || '' }));
      if (sale.sellerId === customerId) {
        const sellerCredit = isActiveSale(sale) ? sellerEarnedForSale(sale) : num(sale.sellerNet);
        const sellerLabel = isActiveSale(sale) ? `استحقاق بيع من التحصيل: ${sale.item}${suffix}` : `بيع: ${sale.item}${suffix}`;
        entries.push({ date: sale.createdAt, label: sellerLabel, debit: 0, credit: sellerCredit, session: getSession(sale.sessionId)?.name || '' });
      }
    });
    state.payments.filter(payment => payment.customerId === customerId).forEach(payment => {
      entries.push({ date: payment.date, label: payment.kind === 'buyer_collection' ? 'دفعة من العميل' : 'تسوية للبائع', debit: payment.kind === 'seller_payout' ? payment.amount : 0, credit: payment.kind === 'buyer_collection' ? payment.amount : 0, session: payment.notes || '' });
    });
    state.nettings.filter(netting => netting.customerId === customerId).forEach(netting => {
      const buyerAmount = (netting.buyerAllocations || []).reduce((sum, item) => sum + num(item.amount), 0);
      const sellerAmount = (netting.sellerAllocations || []).reduce((sum, item) => sum + num(item.amount), 0);
      if (buyerAmount) entries.push({ date: netting.date, label: 'مقاصة: تخفيض المبلغ المطلوب', debit: 0, credit: buyerAmount, session: '' });
      if (sellerAmount) entries.push({ date: netting.date, label: 'مقاصة: خصم من مستحق البائع', debit: sellerAmount, credit: 0, session: '' });
    });
    state.saleReversals.forEach(reversal => {
      const sale = getSale(reversal.saleId); if (!sale) return;
      const label = reversal.type === 'returned' ? 'إرجاع' : 'إلغاء';
      if (sale.buyerId === customerId) entries.push({ date: reversal.date, label: `${label} شراء: ${sale.item}`, debit: 0, credit: num(sale.buyerCharge), session: getSession(sale.sessionId)?.name || '' });
      saleFarqiyas(sale).filter(item => item.payerId === customerId).forEach(item => entries.push({ date: reversal.date, label: `${label} فرقية: ${sale.item}`, debit: 0, credit: num(item.amount), session: getSession(sale.sessionId)?.name || '' }));
      if (sale.sellerId === customerId) entries.push({ date: reversal.date, label: `${label} بيع: ${sale.item}`, debit: num(sale.sellerNet), credit: 0, session: getSession(sale.sessionId)?.name || '' });
      (reversal.refunds || []).filter(item => item.customerId === customerId).forEach(item => entries.push({ date: reversal.date, label: `رد مبلغ للعميل بسبب ${label} البيعة`, debit: item.amount, credit: 0, session: '' }));
      (reversal.recoveries || []).filter(item => item.customerId === customerId).forEach(item => entries.push({ date: reversal.date, label: `استرداد تسوية البائع بسبب ${label} البيعة`, debit: 0, credit: item.amount, session: '' }));
    });
    state.customerAdjustments.filter(item => item.customerId === customerId && item.status !== 'cancelled').forEach(item => {
      entries.push({ date: item.date, label: item.description || 'مبلغ محتفظ به بعد مرتجع', debit: num(item.amount), credit: 0, session: '' });
      if (num(item.settledAmount) > 0) entries.push({ date: item.date, label: 'تغطية المبلغ من المحصل قبل رد المرتجع', debit: 0, credit: num(item.settledAmount), session: '' });
    });
    return entries.sort((a, b) => new Date(a.date) - new Date(b.date));
  }

  function openCustomerLedger(customerId) {
    const customer = getCustomer(customerId); if (!customer) return;
    const entries = customerLedger(customerId); let balance = 0;
    modal({
      title: `كشف حساب: ${customer.name}`, wide: true,
      body: `<div class="grid grid-3 ledger-metrics" style="margin-bottom:14px">${metric('المطلوب منه', money(customerBuyerDue(customer.id)), 'شراء أو فرقية أو خصم مرتجع')}${metric('المستحق له', money(customerSellerDue(customer.id)), 'كبائع')}${metric('الصافي', money(Math.abs(customerSellerDue(customer.id) - customerBuyerDue(customer.id))), customerSellerDue(customer.id) - customerBuyerDue(customer.id) >= 0 ? 'له' : 'عليه')}</div>

  function renderWallets() {
    main.innerHTML = `
      ${pageHead('المحافظ', 'متابعة الأرصدة والتحويلات والحركات المالية', '<button class="secondary" id="walletAdjust">إيداع / سحب</button><button class="primary" id="walletTransfer">تحويل بين المحافظ</button>')}

        const tx = state.walletTransactions.filter(x => x.walletId === wallet.id);
        const incoming = tx.filter(x => x.direction === 'in').reduce((sum, x) => sum + num(x.amount), 0);
        const outgoing = tx.filter(x => x.direction === 'out').reduce((sum, x) => sum + num(x.amount), 0);
        return `<article class="card wallet-card"><div class="wallet-icon">${walletIcon(wallet.type)}</div><div><span class="text-muted">${esc(wallet.name)}</span><div class="wallet-balance">${money(walletBalance(wallet.id))}</div></div><div class="wallet-summary"><div><small>داخل</small><strong class="text-success">${money(incoming)}</strong></div><div><small>خارج</small><strong class="text-danger">${money(outgoing)}</strong></div></div><button class="ghost" data-wallet-history="${wallet.id}">عرض سجل الحركات</button></article>`;

  function walletOptions(selected = '') {
    return state.wallets.map(wallet => `<option value="${wallet.id}" ${wallet.id === selected ? 'selected' : ''}>${esc(wallet.name)} — ${money(walletBalance(wallet.id))}</option>`).join('');

    modal({ title: 'إيداع أو سحب يدوي', small: true,

  function openWalletTransfer() {
    modal({ title: 'تحويل بين المحافظ', small: true,
      body: `<form id="transferForm" class="form-grid"><div class="field full"><label>من محفظة</label><select name="from" required>${walletOptions()}</select></div><div class="field full"><label>إلى محفظة</label><select name="to" required>${walletOptions(state.wallets[1]?.id)}</select></div><div class="field full"><label>المبلغ</label><input name="amount" type="number" min="0.01" step="0.01" required /></div><div class="field full"><label>ملاحظة</label><input name="notes" placeholder="اختياري" /></div></form>`,
      footer: '<button class="secondary" data-close-modal>إلغاء</button><button class="primary" id="saveTransfer">تنفيذ التحويل</button>',

  function renderSettlements() {
    const buyers = state.customers.map(customer => ({ customer, due: customerBuyerDue(customer.id) })).filter(x => x.due > 0).sort((a, b) => b.due - a.due);
    const sellers = state.customers.map(customer => ({ customer, due: customerSellerDue(customer.id) })).filter(x => x.due > 0).sort((a, b) => b.due - a.due);
    const nettable = state.customers.map(customer => ({ customer, buyer: customerBuyerDue(customer.id), seller: customerSellerDue(customer.id) })).filter(x => x.buyer > 0 && x.seller > 0);
    const providers = ['local', 'international'].filter(type => deliveryConfig(type).enabled).map(type => ({ type, due: providerDue(type), settled: providerSettled(type), name: deliveryConfig(type).providerName || deliveryLabel(type) }));
    main.innerHTML = `
      ${pageHead('التسويات', 'تحصيل العملاء وتسوية البائعين وشركات التوصيل والشحن')}
      ${nettable.length ? `<section class="card" style="margin-bottom:16px"><div class="section-title"><h3>مقاصة متاحة</h3><span class="badge info">${numberText(nettable.length)} عميل</span></div><div class="list">${nettable.map(x => `<div class="list-row"><div><h4>${esc(x.customer.name)}</h4><small>عليه ${money(x.buyer)} • له ${money(x.seller)}</small></div><button class="primary compact" data-netting="${x.customer.id}">تنفيذ مقاصة ${money(Math.min(x.buyer, x.seller))}</button></div>`).join('')}</div></section>` : ''}
      <div class="grid grid-2">
        <section class="card"><div class="section-title"><h3>تحصيلات العملاء</h3><span class="badge danger">${numberText(buyers.length)}</span></div>${buyers.length ? `<div class="list">${buyers.map(x => `<div class="list-row"><div><h4>${esc(x.customer.name)}</h4><small>${esc(customerContact(x.customer))}</small></div><div class="align-left"><strong class="text-danger">${money(x.due)}</strong><br><button class="primary compact" data-collect="${x.customer.id}">تسجيل دفعة</button></div></div>`).join('')}</div>` : empty('لا توجد مبالغ مطلوبة من العملاء.')}</section>
        <section class="card"><div class="section-title"><h3>تسويات البائعين من المبالغ المحصلة</h3><span class="badge success">${numberText(sellers.length)}</span></div>${sellers.length ? `<div class="list">${sellers.map(x => `<div class="list-row"><div><h4>${esc(x.customer.name)}</h4><small>${esc(customerContact(x.customer))}</small></div><div class="align-left"><strong class="text-success">${money(x.due)}</strong><br><button class="primary compact" data-payout="${x.customer.id}">تنفيذ تسوية</button></div></div>`).join('')}</div>` : empty('لا توجد مستحقات بائعين من مبالغ محصلة حالياً.')}</section>
      </div>
      <section class="card provider-settlements" style="margin-top:16px"><div class="section-title"><h3>تسويات شركات التوصيل والشحن</h3><span class="badge info">طرف ثالث</span></div>
        <div class="grid grid-2">${providers.map(provider => `<article class="provider-card"><div><span class="provider-type">${esc(deliveryLabel(provider.type))}</span><h4>${esc(provider.name)}</h4><small>تمت تسويته: ${money(provider.settled)}</small></div><div class="provider-due"><small>المتبقي</small><strong>${money(provider.due)}</strong><button class="primary compact" data-provider-payout="${provider.type}" ${provider.due <= 0 ? 'disabled' : ''}>تنفيذ تسوية</button></div></article>`).join('')}</div>
      </section>`;
    main.querySelectorAll('[data-collect]').forEach(btn => btn.addEventListener('click', () => openPaymentForm('buyer_collection', btn.dataset.collect)));
    main.querySelectorAll('[data-payout]').forEach(btn => btn.addEventListener('click', () => openPaymentForm('seller_payout', btn.dataset.payout)));
    main.querySelectorAll('[data-netting]').forEach(btn => btn.addEventListener('click', () => executeNetting(btn.dataset.netting)));
    main.querySelectorAll('[data-provider-payout]').forEach(btn => btn.addEventListener('click', () => openDeliveryPaymentForm(btn.dataset.providerPayout)));
  }

  function autoAllocateDelivery(deliveryMethod, amount) {
    const relevant = state.sales.filter(sale => sale.deliveryMethod === deliveryMethod).map(sale => ({ sale, due: deliveryDueForSale(sale) })).filter(item => item.due > 0).sort((a, b) => new Date(a.sale.createdAt) - new Date(b.sale.createdAt));
    let remaining = round(amount); const allocations = [];
    relevant.forEach(item => { if (remaining <= 0) return; const allocated = Math.min(remaining, item.due); allocations.push({ saleId: item.sale.id, amount: round(allocated) }); remaining = round(remaining - allocated); });
    return { allocations, remaining };
  }

  function openDeliveryPaymentForm(deliveryMethod) {
    const config = deliveryConfig(deliveryMethod); const due = providerDue(deliveryMethod); const providerName = config.providerName || config.label;
    if (due <= 0) return toast('لا توجد مستحقات لهذا الطرف', 'error');
    modal({
      title: `تسوية ${providerName}`, small: true,
      body: `<form id="deliveryPaymentForm" class="form-grid"><div class="field full"><div class="preview-box"><small>إجمالي المستحق</small><div class="metric-value">${money(due)}</div></div></div><div class="field full"><label>المبلغ</label><input name="amount" type="number" inputmode="decimal" min="0.01" max="${due}" step="0.01" value="${due}" required /></div><div class="field full"><label>محفظة الدفع</label><select name="walletId" required>${walletOptions('wallet_bank')}</select></div><div class="field full"><label>ملاحظة</label><input name="notes" placeholder="اختياري" /></div></form>`,
      footer: '<button class="secondary" data-close-modal>إلغاء</button><button class="primary" id="saveDeliveryPayment">تأكيد التسوية</button>',
      onReady(root) {
        root.querySelector('#saveDeliveryPayment').addEventListener('click', () => {
          const form = root.querySelector('#deliveryPaymentForm'); if (!form.reportValidity()) return;
          const fd = new FormData(form); const amount = round(fd.get('amount')); const walletId = fd.get('walletId');
          if (amount > due + 0.001) return toast('المبلغ أكبر من المستحق', 'error');
          if (walletBalance(walletId) + 0.001 < amount) return toast('رصيد المحفظة غير كافٍ', 'error');
          const allocation = autoAllocateDelivery(deliveryMethod, amount); if (allocation.remaining > 0.001) return toast('تعذر توزيع كامل المبلغ', 'error');
          const payment = { id: Store.uid('pay'), kind: 'delivery_payout', providerType: deliveryMethod, customerId: null, amount, walletAmount: amount, walletId, allocations: allocation.allocations, notes: fd.get('notes').trim(), date: new Date().toISOString() };
          state.payments.push(payment);
          addWalletTransaction({ walletId, direction: 'out', amount, description: `تسوية ${providerName}`, refType: 'payment', refId: payment.id });
          persist(`تمت تسوية ${providerName}`); closeModal(); renderSettlements();
        });
      }
    });
  }

  function preferredCollectionWallet(customerId) {
    const sale = state.sales
      .filter(isActiveSale)
      .filter(item => customerDueForSale(item, customerId) > 0)
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt))[0];
    return paymentWalletId(sale?.paymentMethod || 'bank');
  }

  function previousGatewayFeeForSale(saleId) {
    return round(state.payments.reduce((sum, payment) => sum + (payment.gatewayFeeAllocations || [])
      .filter(item => item.saleId === saleId)
      .reduce((inner, item) => inner + num(item.amount), 0), 0));
  }

  function calculateGatewayFeeAllocations(allocations, customerId, walletId) {
    if (walletId !== 'wallet_gateway') return [];
    return (allocations || []).map(allocation => {
      const sale = getSale(allocation.saleId);
      if (!sale || sale.paymentMethod !== 'gateway' || sale.buyerId !== customerId || num(sale.gatewayFeeAmount) <= 0) return null;
      const alreadyCharged = previousGatewayFeeForSale(sale.id);
      const remainingFee = Math.max(0, round(num(sale.gatewayFeeAmount) - alreadyCharged));
      const dueBeforePayment = customerDueForSale(sale, customerId);
      if (remainingFee <= 0 || dueBeforePayment <= 0) return null;
      const amount = num(allocation.amount) + 0.001 >= dueBeforePayment
        ? remainingFee
        : Math.min(remainingFee, round(remainingFee * num(allocation.amount) / dueBeforePayment));
      return amount > 0 ? { saleId: sale.id, amount } : null;
    }).filter(Boolean);
  }

  function openPaymentForm(kind, customerId) {
    const customer = getCustomer(customerId);
    const due = kind === 'buyer_collection' ? customerBuyerDue(customerId) : customerSellerDue(customerId);
    const defaultWallet = kind === 'buyer_collection' ? preferredCollectionWallet(customerId) : 'wallet_bank';
    modal({
      title: kind === 'buyer_collection' ? `تحصيل من ${customer.name}` : `تسوية للبائع ${customer.name}`,
      small: true,
      body: `<form id="paymentForm" class="form-grid">
        <div class="field full"><div class="preview-box"><small>المبلغ الحالي</small><div class="metric-value">${money(due)}</div></div></div>
        <div class="field full"><label>المبلغ</label><input name="amount" type="number" min="0.01" max="${due}" step="0.01" value="${due}" required /></div>
        <div class="field full"><label>${kind === 'buyer_collection' ? 'طريقة الدفع / محفظة الإيداع' : 'محفظة الدفع'}</label><select name="walletId" required>${walletOptions(defaultWallet)}</select></div>
        ${kind === 'buyer_collection' ? `<div class="field full"><div id="gatewayPaymentPreview" class="gateway-payment-preview hidden"><div><small>المبلغ المحصل</small><strong id="paymentGross">${money(0)}</strong></div><div><small>رسوم بوابة الدفع</small><strong id="paymentGatewayFee">${money(0)}</strong></div><div><small>صافي المضاف للمحفظة</small><strong id="paymentNet">${money(0)}</strong></div></div><small class="help">تُخصم رسوم البوابة من المبلغ المحصل، ولا تُحتسب ضمن أرباح المزاد.</small></div>` : ''}
        <div class="field full"><label>ملاحظة</label><input name="notes" placeholder="اختياري" /></div>
      </form>`,
      footer: '<button class="secondary" data-close-modal>إلغاء</button><button class="primary" id="savePayment">تأكيد العملية</button>',
      onReady(root) {
        const form = root.querySelector('#paymentForm');

        function paymentPreview() {
          if (kind !== 'buyer_collection') return;
          const amount = round(form.elements.amount.value);
          const walletId = form.elements.walletId.value;
          const allocation = autoAllocate(kind, customerId, amount);
          const feeAllocations = calculateGatewayFeeAllocations(allocation.allocations, customerId, walletId);
          const fee = round(feeAllocations.reduce((sum, item) => sum + num(item.amount), 0));
          const net = round(amount - fee);
          root.querySelector('#gatewayPaymentPreview').classList.toggle('hidden', walletId !== 'wallet_gateway' || fee <= 0);
          root.querySelector('#paymentGross').textContent = money(amount);
          root.querySelector('#paymentGatewayFee').textContent = money(fee);
          root.querySelector('#paymentNet').textContent = money(net);
        }

        form.elements.amount.addEventListener('input', paymentPreview);
        form.elements.walletId.addEventListener('change', paymentPreview);
        paymentPreview();

        root.querySelector('#savePayment').addEventListener('click', () => {
          if (!form.reportValidity()) return;
          const fd = new FormData(form);
          const amount = round(fd.get('amount'));
          const walletId = fd.get('walletId');
          if (amount > due + 0.001) return toast('المبلغ أكبر من المستحق', 'error');
          if (kind === 'seller_payout' && walletBalance(walletId) < amount) return toast('رصيد المحفظة غير كافٍ', 'error');
          const allocation = autoAllocate(kind, customerId, amount);
          if (allocation.remaining > 0.001) return toast('تعذر توزيع كامل المبلغ', 'error');
          const gatewayFeeAllocations = kind === 'buyer_collection' ? calculateGatewayFeeAllocations(allocation.allocations, customerId, walletId) : [];
          const gatewayFeeAmount = round(gatewayFeeAllocations.reduce((sum, item) => sum + num(item.amount), 0));
          const walletAmount = kind === 'buyer_collection' ? round(amount - gatewayFeeAmount) : amount;
          const payment = {
            id: Store.uid('pay'), kind, customerId, amount, walletAmount, walletId,
            gatewayFeeAmount, gatewayFeeAllocations,
            allocations: allocation.allocations,
            notes: fd.get('notes').trim(), date: new Date().toISOString()
          };
          state.payments.push(payment);
          addWalletTransaction({
            walletId,
            direction: kind === 'buyer_collection' ? 'in' : 'out',
            amount: walletAmount,
            description: kind === 'buyer_collection'
              ? `تحصيل من ${customer.name}${gatewayFeeAmount ? ` — صافي بعد رسوم بوابة ${money(gatewayFeeAmount)}` : ''}`
              : `تسوية للبائع ${customer.name}`,
            refType: 'payment', refId: payment.id
          });
          persist(kind === 'buyer_collection' ? 'تم تسجيل التحصيل' : 'تمت تسوية مستحق البائع');
          closeModal();
          renderSettlements();
        });
      }
    });
  }


  function executeNetting(customerId) {
    const customer = getCustomer(customerId); const buyerDue = customerBuyerDue(customerId); const sellerDue = customerSellerDue(customerId); const amount = Math.min(buyerDue, sellerDue);
    if (amount <= 0) return toast('لا توجد مقاصة متاحة', 'error');
    if (!confirm(`سيتم خصم ${money(amount)} من المبلغ المطلوب من العميل ومن مستحقاته كبائع. هل تريد المتابعة؟`)) return;
    const buyer = autoAllocate('buyer_collection', customerId, amount); const seller = autoAllocate('seller_payout', customerId, amount);
    state.nettings.push({ id: Store.uid('net'), customerId, amount, buyerAllocations: buyer.allocations, sellerAllocations: seller.allocations, date: new Date().toISOString() });
    persist('تم تنفيذ المقاصة بنجاح'); renderSettlements();
  }

  function reportDocumentCode(type = 'RPT') {
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
    return `${String(type || 'RPT').toUpperCase()}-${stamp}`;
  }

    const showLogo = options.showLogo !== false;
    const logo = showLogo
      ? (state.settings.logo ? `<img src="${state.settings.logo}" alt="شعار المزاد">` : `<div class="report-logo-fallback">${esc((state.settings.auctionName || 'م').charAt(0))}</div>`)
      : '';
    return `<header class="report-header official-report-header">
      <div class="report-brand-block">${logo}<div><div class="report-org-name">${esc(state.settings.auctionName || 'مزادي')}</div><h1>${esc(title)}</h1>${subtitle ? `<p>${esc(subtitle)}</p>` : ''}</div></div>
      <div class="report-document-meta"><div><span>رقم التقرير</span><strong>${esc(options.documentCode || reportDocumentCode(options.typeCode))}</strong></div><div><span>تاريخ الإصدار</span><strong>${dateTimeText(new Date().toISOString())}</strong></div></div>
    </header>`;
  }

    return `<footer class="official-report-footer">
      ${options.showSignatures !== false ? `<div class="report-signatures"><div><span>أُعد بواسطة</span><strong>____________________</strong></div><div><span>تمت المراجعة</span><strong>____________________</strong></div><div><span>الاعتماد</span><strong>____________________</strong></div></div>` : ''}
