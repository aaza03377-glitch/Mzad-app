    </footer>`;
  }

  function reportMetrics(items) {
    return `<div class="report-metrics">${items.map(item => `<div><small>${esc(item.label)}</small><strong>${esc(item.value)}</strong>${item.note ? `<span>${esc(item.note)}</span>` : ''}</div>`).join('')}</div>`;
  }

  function reportTable(headers, rows, emptyText = 'لا توجد بيانات') {
    if (!rows.length) return `<div class="report-empty">${esc(emptyText)}</div>`;
    return `<div class="report-table-wrap"><table class="report-table"><thead><tr>${headers.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  }

  function reportHas(options, key, fallback = true) {
    return options && Object.prototype.hasOwnProperty.call(options, key) ? Boolean(options[key]) : fallback;
  }

  function buildOverallReport(options = {}) {
    const activeSales = state.sales.filter(isActiveSale);
    const totalSales = round(activeSales.reduce((sum, sale) => sum + num(sale.price), 0));
    const collected = round(activeSales.reduce((sum, sale) => sum + saleCollected(sale), 0));
    const buyerDue = round(state.customers.reduce((sum, customer) => sum + customerBuyerDue(customer.id), 0));
    const sellerDue = round(state.customers.reduce((sum, customer) => sum + customerSellerDue(customer.id), 0));
    const commission = round(state.sessions.reduce((sum, session) => sum + sessionSummary(session.id).commission, 0));
    const gatewayFees = round(activeSales.reduce((sum, sale) => sum + num(sale.gatewayFeeAmount), 0));
    const deliveryDue = round(providerDue('local') + providerDue('international'));
    const sessionRows = [...state.sessions].sort((a, b) => new Date(b.date) - new Date(a.date)).map(session => {
      const summary = sessionSummary(session.id);
      return `<tr><td>${esc(session.name)}</td><td>${dateText(session.date)}</td><td>${numberText(summary.count)}</td><td>${money(summary.total)}</td><td>${money(summary.collected)}</td><td>${money(summary.uncollected)}</td><td>${money(summary.sellerDue)}</td><td>${money(summary.deliveryDue)}</td><td>${money(summary.commission)}</td></tr>`;
    });
    const walletRows = state.wallets.map(wallet => {
      const tx = state.walletTransactions.filter(item => item.walletId === wallet.id);
      const incoming = round(tx.filter(item => item.direction === 'in').reduce((sum, item) => sum + num(item.amount), 0));
      const outgoing = round(tx.filter(item => item.direction === 'out').reduce((sum, item) => sum + num(item.amount), 0));
      return `<tr><td>${esc(wallet.name)}</td><td>${money(wallet.openingBalance)}</td><td>${money(incoming)}</td><td>${money(outgoing)}</td><td>${money(walletBalance(wallet.id))}</td></tr>`;
    });
    const providerRows = ['local', 'international'].map(type => `<tr><td>${esc(deliveryLabel(type))}</td><td>${esc(deliveryConfig(type).providerName || deliveryLabel(type))}</td><td>${money(providerSettled(type))}</td><td>${money(providerDue(type))}</td></tr>`);
    return `<section class="print-report official-report">${reportHeader('التقرير الإداري والمالي العام', 'ملخص رسمي شامل لأعمال المزاد', { ...options, typeCode: 'OVERALL' })}
      <div class="report-scope-box"><span>نطاق التقرير</span><strong>جميع الجلسات والعملاء والمحافظ حتى تاريخ الإصدار</strong></div>
      ${reportHas(options, 'showSummary') ? reportMetrics([
        { label: 'إجمالي المبيعات', value: money(totalSales), note: `${numberText(activeSales.length)} بيعة فعالة` },
        { label: 'إجمالي المحصل', value: money(collected) }, { label: 'غير المحصل', value: money(buyerDue) },
        { label: 'مستحقات البائعين', value: money(sellerDue) }, { label: 'مستحقات شركات التوصيل', value: money(deliveryDue), note: 'طرف ثالث' },
        { label: 'عمولة المزاد', value: money(commission), note: 'أرباح المزاد' }, { label: 'رسوم بوابة الدفع', value: money(gatewayFees), note: 'ليست من الأرباح' }
      ]) : ''}
      ${reportHas(options, 'showSessions') ? `<h3 class="report-section-title">أولاً: ملخص الجلسات</h3>${reportTable(['الجلسة', 'التاريخ', 'البيعات', 'إجمالي البيع', 'المحصل', 'غير المحصل', 'مستحق البائع', 'مستحق التوصيل', 'عمولة المزاد'], sessionRows, 'لا توجد جلسات')}` : ''}
      ${reportHas(options, 'showProviders') ? `<h3 class="report-section-title">ثانياً: التزامات شركات التوصيل والشحن</h3>${reportTable(['نوع الخدمة', 'الشركة', 'تمت التسوية', 'المتبقي'], providerRows)}` : ''}
      ${reportHas(options, 'showWallets') ? `<h3 class="report-section-title">ثالثاً: ملخص المحافظ</h3>${reportTable(['المحفظة', 'الرصيد الافتتاحي', 'داخل', 'خارج', 'الرصيد الحالي'], walletRows)}` : ''}
      ${reportFooter(options)}
    </section>`;
  }

  function buildSessionReport(sessionId, options = {}) {
    const session = getSession(sessionId);
    if (!session) return `<section class="print-report official-report">${reportHeader('تقرير الجلسة', '', options)}<div class="report-empty">اختر جلسة صحيحة.</div></section>`;
    const summary = sessionSummary(session.id);
    const sales = [...salesForSession(session.id)].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    const gatewayFees = round(sales.filter(isActiveSale).reduce((sum, sale) => sum + num(sale.gatewayFeeAmount), 0));
    const headers = ['#', 'السلعة'];
    const columnBuilders = [];
    function addColumn(key, header, builder) { if (reportHas(options, key)) { headers.push(header); columnBuilders.push(builder); } }
    addColumn('showSeller', 'البائع', sale => esc(getCustomer(sale.sellerId)?.name || '—'));
    addColumn('showSellerPhone', 'تواصل البائع', sale => esc(customerContact(getCustomer(sale.sellerId))));
    addColumn('showBuyer', 'المشتري', sale => esc(getCustomer(sale.buyerId)?.name || '—'));
    addColumn('showBuyerPhone', 'تواصل المشتري', sale => esc(customerContact(getCustomer(sale.buyerId))));
    addColumn('showPrice', 'سعر البيع', sale => money(sale.price));
    addColumn('showFarqiya', 'الفرقيات', sale => saleFarqiyas(sale).length ? saleFarqiyas(sale).map(entry => { const payer = getCustomer(entry.payerId); return `${money(entry.amount)}<br><small>${esc(payer?.name || '')} • ${esc(customerContact(payer))}</small>`; }).join('<hr>') : '—');
    addColumn('showDelivery', 'التوصيل / الشحن', sale => `${esc(deliveryLabel(sale.deliveryMethod))}<br><small>${sale.deliveryMethod === 'pickup' ? '—' : `${esc(deliveryConfig(sale.deliveryMethod).providerName || '')} • ${money(sale.deliveryFee)}`}</small>`);
    addColumn('showPayment', 'طريقة الدفع', sale => `${esc(paymentMethodLabel(sale.paymentMethod))}${num(sale.gatewayFeeAmount) ? `<br><small>رسوم بوابة ${money(sale.gatewayFeeAmount)}</small>` : ''}`);
    addColumn('showCommission', 'عمولة المزاد', sale => `${money(sale.commissionAmount)}<br><small>${esc(commissionDescription(sale))}</small>`);
    addColumn('showSellerNet', 'صافي البائع عند اكتمال التحصيل', sale => money(sale.sellerNet));
    addColumn('showSellerAvailable', 'المتاح لتسوية البائع', sale => money(sellerEarnedForSale(sale)));
    addColumn('showCollected', 'المحصل', sale => money(saleCollected(sale)));
    addColumn('showDue', 'المتبقي', sale => money(buyerDueForSale(sale)));
    addColumn('showStatus', 'الحالة', sale => esc(saleStatus(sale).text));
    addColumn('showNotes', 'ملاحظات', sale => esc(sale.notes || '—'));
    const rows = sales.map((sale, index) => `<tr class="${isActiveSale(sale) ? '' : 'report-inactive-row'}"><td>${numberText(index + 1)}</td><td>${esc(sale.item)}</td>${columnBuilders.map(builder => `<td>${builder(sale)}</td>`).join('')}</tr>`);
    return `<section class="print-report official-report">${reportHeader(`تقرير جلسة: ${session.name}`, 'كشف رسمي ببيعات الجلسة وحالتها المالية', { ...options, typeCode: 'SESSION' })}
      <div class="report-info-grid"><div><span>تاريخ الجلسة</span><strong>${dateText(session.date)}</strong></div><div><span>حالة الجلسة</span><strong>${session.status === 'closed' ? 'مغلقة' : 'مفتوحة'}</strong></div><div><span>عدد السجلات</span><strong>${numberText(sales.length)}</strong></div></div>
      ${reportHas(options, 'showSummary') ? reportMetrics([
        { label: 'عدد البيعات الفعالة', value: numberText(summary.count) }, { label: 'إجمالي البيع', value: money(summary.total) },
        { label: 'تم التحصيل', value: money(summary.collected) }, { label: 'غير محصل', value: money(summary.uncollected) },
        { label: 'مستحقات البائعين', value: money(summary.sellerDue) }, { label: 'تمت تسوية البائعين', value: money(summary.sellerSettled) },
        { label: 'مستحقات التوصيل والشحن', value: money(summary.deliveryDue), note: 'طرف ثالث' },
        { label: 'عمولة المزاد', value: money(summary.commission), note: 'أرباح الجلسة' }, { label: 'رسوم بوابة الدفع', value: money(gatewayFees), note: 'ليست من الأرباح' }
      ]) : ''}
      <h3 class="report-section-title">تفاصيل البيعات</h3>${reportTable(headers, rows, 'لا توجد بيعات في هذه الجلسة')}
      ${reportFooter(options)}
    </section>`;
  }

  function buildCustomerReport(customerId, options = {}) {
    const customer = getCustomer(customerId);
    if (!customer) return `<section class="print-report official-report">${reportHeader('تقرير العميل', '', options)}<div class="report-empty">اختر عميلاً صحيحاً.</div></section>`;
    const entries = customerLedger(customer.id);
    let balance = 0;
    const headers = ['التاريخ', 'البيان'];
    if (reportHas(options, 'showSession')) headers.push('الجلسة');
    if (reportHas(options, 'showDebit')) headers.push('مدين');
    if (reportHas(options, 'showCredit')) headers.push('دائن');
    if (reportHas(options, 'showBalance')) headers.push('الرصيد');
    const rows = entries.map(entry => {
      balance = round(balance + num(entry.credit) - num(entry.debit));
      const cells = [`<td>${dateTimeText(entry.date)}</td>`, `<td>${esc(entry.label)}</td>`];
      if (reportHas(options, 'showSession')) cells.push(`<td>${esc(entry.session || '—')}</td>`);
      if (reportHas(options, 'showDebit')) cells.push(`<td>${entry.debit ? money(entry.debit) : '—'}</td>`);
      if (reportHas(options, 'showCredit')) cells.push(`<td>${entry.credit ? money(entry.credit) : '—'}</td>`);
      if (reportHas(options, 'showBalance')) cells.push(`<td>${money(Math.abs(balance))} ${balance >= 0 ? 'له' : 'عليه'}</td>`);
      return `<tr>${cells.join('')}</tr>`;
    });
    const buyerDue = customerBuyerDue(customer.id);
    const sellerDue = customerSellerDue(customer.id);
    const net = round(sellerDue - buyerDue);
    return `<section class="print-report official-report">${reportHeader(`كشف حساب العميل: ${customer.name}`, 'بيان رسمي بالحركات والمستحقات', { ...options, typeCode: 'CUSTOMER' })}
      <div class="report-info-grid"><div><span>اسم العميل</span><strong>${esc(customer.name)}</strong></div><div><span>بيانات التواصل</span><strong>${esc(customerContact(customer))}</strong></div><div><span>الرمز المرجعي</span><strong>${esc(customer.customerCode || '—')}</strong></div></div>
      ${reportHas(options, 'showSummary') ? reportMetrics([
        { label: 'المطلوب من العميل', value: money(buyerDue) },
        { label: 'المستحق للعميل', value: money(sellerDue) },
        { label: 'الرصيد الصافي', value: net === 0 ? 'متوازن' : `${money(Math.abs(net))} ${net > 0 ? 'له' : 'عليه'}` }
      ]) : ''}
      <h3 class="report-section-title">كشف الحركة المالية</h3>
      ${reportTable(headers, rows, 'لا توجد حركات لهذا العميل')}
      ${reportFooter(options)}
    </section>`;
  }

  function buildWalletReport(walletId, options = {}) {
    const wallet = getWallet(walletId);
    if (!wallet) return `<section class="print-report official-report">${reportHeader('تقرير المحفظة', '', options)}<div class="report-empty">اختر محفظة صحيحة.</div></section>`;
    const tx = state.walletTransactions.filter(item => item.walletId === wallet.id).sort((a, b) => new Date(a.date) - new Date(b.date));
    const incoming = round(tx.filter(item => item.direction === 'in').reduce((sum, item) => sum + num(item.amount), 0));
    const outgoing = round(tx.filter(item => item.direction === 'out').reduce((sum, item) => sum + num(item.amount), 0));
    let running = num(wallet.openingBalance);
    const headers = ['التاريخ'];
    if (reportHas(options, 'showDescription')) headers.push('البيان');
    if (reportHas(options, 'showIncoming')) headers.push('داخل');
    if (reportHas(options, 'showOutgoing')) headers.push('خارج');
    if (reportHas(options, 'showBalance')) headers.push('الرصيد');
    const rows = tx.map(item => {
      running = round(running + (item.direction === 'in' ? num(item.amount) : -num(item.amount)));
      const cells = [`<td>${dateTimeText(item.date)}</td>`];
      if (reportHas(options, 'showDescription')) cells.push(`<td>${esc(item.description)}</td>`);
      if (reportHas(options, 'showIncoming')) cells.push(`<td>${item.direction === 'in' ? money(item.amount) : '—'}</td>`);
      if (reportHas(options, 'showOutgoing')) cells.push(`<td>${item.direction === 'out' ? money(item.amount) : '—'}</td>`);
      if (reportHas(options, 'showBalance')) cells.push(`<td>${money(running)}</td>`);
      return `<tr>${cells.join('')}</tr>`;
    });
    return `<section class="print-report official-report">${reportHeader(`تقرير المحفظة: ${wallet.name}`, 'كشف رسمي بالحركات المالية', { ...options, typeCode: 'WALLET' })}
      <div class="report-info-grid"><div><span>اسم المحفظة</span><strong>${esc(wallet.name)}</strong></div><div><span>نوع المحفظة</span><strong>${esc(wallet.type || '—')}</strong></div><div><span>عدد الحركات</span><strong>${numberText(tx.length)}</strong></div></div>
      ${reportHas(options, 'showSummary') ? reportMetrics([
        { label: 'الرصيد الافتتاحي', value: money(wallet.openingBalance) },
        { label: 'إجمالي الداخل', value: money(incoming) },
        { label: 'إجمالي الخارج', value: money(outgoing) },
        { label: 'الرصيد الحالي', value: money(walletBalance(wallet.id)) }
      ]) : ''}
      <h3 class="report-section-title">سجل الحركات</h3>
      ${reportTable(headers, rows, 'لا توجد حركات في هذه المحفظة')}
      ${reportFooter(options)}
    </section>`;
  }

  function reportTargetOptions(type) {
    if (type === 'session') return [...state.sessions].sort((a, b) => new Date(b.date) - new Date(a.date)).map(item => `<option value="${item.id}">${esc(item.name)} — ${dateText(item.date)}</option>`).join('');
    if (type === 'customer') return [...state.customers].sort((a, b) => a.name.localeCompare(b.name, 'ar')).map(item => `<option value="${item.id}">${esc(item.name)} — ${esc(customerContact(item))}</option>`).join('');
    if (type === 'wallet') return state.wallets.map(item => `<option value="${item.id}">${esc(item.name)}</option>`).join('');
    return '<option value="overall">جميع البيانات</option>';
  }

  function reportOptionDefinitions(type) {
    const common = [
      ['showLogo', 'إظهار الشعار', true],
      ['showSummary', 'إظهار الملخص المالي', true],
      ['showSignatures', 'خانات التوقيع والاعتماد', true]
    ];
    if (type === 'overall') return [...common, ['showSessions', 'ملخص الجلسات', true], ['showProviders', 'شركات التوصيل والشحن', true], ['showWallets', 'ملخص المحافظ', true]];
    if (type === 'session') return [...common,
      ['showSeller', 'اسم البائع', true], ['showSellerPhone', 'تواصل البائع', false],
      ['showBuyer', 'اسم المشتري', true], ['showBuyerPhone', 'تواصل المشتري', true],
      ['showPrice', 'سعر البيع', true], ['showFarqiya', 'الفرقيات', true], ['showDelivery', 'التوصيل والشحن', true],
      ['showPayment', 'طريقة الدفع', true], ['showCommission', 'عمولة المزاد', true], ['showSellerNet', 'صافي البائع عند اكتمال التحصيل', true],
      ['showSellerAvailable', 'المتاح لتسوية البائع', true], ['showCollected', 'المحصل', true], ['showDue', 'المتبقي', true], ['showStatus', 'حالة البيعة', true], ['showNotes', 'الملاحظات', false]
    ];
    if (type === 'customer') return [...common, ['showSession', 'اسم الجلسة', true], ['showDebit', 'المدين', true], ['showCredit', 'الدائن', true], ['showBalance', 'الرصيد المتحرك', true]];
    return [...common, ['showDescription', 'بيان الحركة', true], ['showIncoming', 'المبالغ الداخلة', true], ['showOutgoing', 'المبالغ الخارجة', true], ['showBalance', 'الرصيد المتحرك', true]];
  }

  function buildSelectedReport(type, targetId, options = {}) {
    if (type === 'session') return buildSessionReport(targetId, options);
    if (type === 'customer') return buildCustomerReport(targetId, options);
    if (type === 'wallet') return buildWalletReport(targetId, options);
    return buildOverallReport(options);
  }

  function reportOrientation(type, options = {}) {
    if (type !== 'session') return 'portrait';
    const detailKeys = ['showSeller', 'showSellerPhone', 'showBuyer', 'showBuyerPhone', 'showPrice', 'showFarqiya', 'showDelivery', 'showPayment', 'showCommission', 'showSellerNet', 'showSellerAvailable', 'showCollected', 'showDue', 'showStatus', 'showNotes'];
    const visibleColumns = detailKeys.reduce((count, key) => count + (reportHas(options, key) ? 1 : 0), 2);
    return visibleColumns > 8 ? 'landscape' : 'portrait';
  }

      @page { size: A4 ${orientation}; margin: ${orientation === 'landscape' ? '9mm 8mm 11mm' : '11mm 9mm 13mm'}; }
      @media print {
        html, body { width: auto; min-height: auto; }
        .official-report-header, .report-info-grid, .report-scope-box, .report-metrics { break-inside: avoid; page-break-inside: avoid; }
      }
    `;
  }

  function standaloneReportScreenStyles(orientation = 'portrait') {
    const pageWidth = orientation === 'landscape' ? '297mm' : '210mm';
    return `
      @media screen {
        html, body { min-height: 100%; background: #e9eef5; }
        body { padding: 18px; }
        .report-print-toolbar {
          position: sticky; top: 10px; z-index: 20; max-width: ${pageWidth}; margin: 0 auto 14px;
          display: flex; align-items: center; justify-content: space-between; gap: 12px;
          padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 12px;
          background: rgba(255,255,255,.96); box-shadow: 0 8px 24px rgba(15,23,42,.12);
          font-family: Tahoma, Arial, sans-serif;
        }
        .report-print-toolbar .toolbar-message { display: grid; gap: 2px; color: #334155; }
        .report-print-toolbar .toolbar-message strong { font-size: 14px; }
        .report-print-toolbar .toolbar-message span { color: #64748b; font-size: 12px; }
        .report-print-toolbar .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .report-print-toolbar button {
          border: 0; border-radius: 9px; padding: 9px 13px; font: 700 13px Tahoma, Arial, sans-serif; cursor: pointer;
        }
        .report-print-toolbar .print-now { background: #0f766e; color: #fff; }
        .report-print-toolbar .close-report { background: #e2e8f0; color: #1e293b; }
        .print-document {
          width: ${pageWidth}; max-width: 100%; min-height: 120mm; margin: 0 auto; padding: 10mm;
          background: #fff; box-shadow: 0 12px 38px rgba(15,23,42,.14);
        }
      }
      @media (max-width: 700px) {
        body { padding: 8px; }
        .report-print-toolbar { top: 5px; align-items: stretch; flex-direction: column; }
        .report-print-toolbar .toolbar-actions { width: 100%; }
        .report-print-toolbar button { flex: 1; }
        .print-document { padding: 6mm; }
      }
      @media print {
        .report-print-toolbar { display: none !important; }
        html, body { background: #fff !important; padding: 0 !important; }
        .print-document { width: auto !important; max-width: none !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
      }
    `;
  }

  function createOfficialReportDocument(reportHtml, title, orientation = 'portrait') {
    const safeTitle = esc(title);
    return `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>${safeTitle}</title>
  <style>${officialReportPrintStyles(orientation)}${standaloneReportScreenStyles(orientation)}</style>
</head>
<body>
  <div class="report-print-toolbar" role="toolbar" aria-label="أدوات التقرير">
    <div class="toolbar-message"><strong>مستند تقرير مستقل</strong><span>اضغط طباعة ثم اختر حفظ كملف PDF. لن تتم طباعة واجهة النظام.</span></div>
    <div class="toolbar-actions"><button type="button" class="close-report" id="closeReportPage">إغلاق</button><button type="button" class="print-now" id="printReportPage">طباعة / حفظ PDF</button></div>
  </div>
  <main class="print-document" id="officialReportDocument">${reportHtml}</main>
  <script>
    (() => {
      const printButton = document.getElementById('printReportPage');
      const closeButton = document.getElementById('closeReportPage');
      const runPrint = () => { try { window.focus(); window.print(); } catch (error) { console.error(error); } };
      printButton.addEventListener('click', runPrint);
      closeButton.addEventListener('click', () => window.close());
      window.addEventListener('load', () => {
        const images = Array.from(document.images);
        const ready = !images.length || images.every(image => image.complete);
        window.setTimeout(runPrint, ready ? 450 : 1200);
      }, { once: true });
    })();
  <\/script>
</body>
</html>`;
  }

  function printStandaloneReport(reportHtml, title, orientation = 'portrait') {
    const documentHtml = createOfficialReportDocument(reportHtml, title, orientation);
    const blob = new Blob([documentHtml], { type: 'text/html;charset=utf-8' });
    const reportUrl = URL.createObjectURL(blob);

    let reportWindow = null;
    try {
      reportWindow = window.open(reportUrl, '_blank');
    } catch (error) {
      console.error(error);
    }

    if (!reportWindow) {
      const link = document.createElement('a');
      link.href = reportUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
      toast('تم فتح التقرير في صفحة مستقلة. إذا لم تظهر، اسمح بالنوافذ المنبثقة لهذا الموقع.', 'info');
    }

    window.setTimeout(() => URL.revokeObjectURL(reportUrl), 300000);
  }

  function printOfficialReport(type, targetId, options = {}) {
    const typeCodes = { session: 'SESSION', customer: 'CUSTOMER', wallet: 'WALLET', overall: 'OVERALL' };
    const documentOptions = { ...options, documentCode: reportDocumentCode(typeCodes[type] || 'RPT') };
    const reportHtml = buildSelectedReport(type, targetId, documentOptions);
    const orientation = reportOrientation(type, documentOptions);
    const title = `${state.settings.auctionName || 'المزاد'} - تقرير رسمي`;
    printStandaloneReport(reportHtml, title, orientation);
  }

  function renderReports() {
    main.innerHTML = `${pageHead('التقارير', 'تقارير رسمية قابلة للتخصيص والطباعة حسب الجلسة أو العميل أو المحفظة')}
      <section class="card report-controls no-print">
        <div class="report-control-header"><div><h3>إعداد التقرير</h3><p>اختر نوع التقرير ثم حدد الأقسام والأعمدة التي تريد ظهورها.</p></div><span class="badge info">معاينة مباشرة</span></div>
        <div class="form-grid report-filter-grid">
          <div class="field"><label>نوع التقرير</label><select id="reportType"><option value="session">تقرير جلسة</option><option value="customer">كشف عميل</option><option value="wallet">تقرير محفظة</option><option value="overall">تقرير عام</option></select></div>
          <div class="field"><label>الاختيار</label><select id="reportTarget"></select></div>
          <div class="field report-buttons"><label>&nbsp;</label><div class="actions"><button class="secondary" id="showReport">تحديث المعاينة</button><button class="primary" id="printReport">فتح التقرير للطباعة</button></div></div>
        </div>
        <div class="report-options-panel"><div class="report-options-title">المحتوى الظاهر في التقرير</div><div id="reportOptions" class="report-option-grid"></div></div>
      </section>
      <div id="reportOutput" class="report-output"></div>`;
    const typeSelect = document.getElementById('reportType');
    const targetSelect = document.getElementById('reportTarget');
    const output = document.getElementById('reportOutput');
    const optionsRoot = document.getElementById('reportOptions');

    function renderOptions() {
      optionsRoot.innerHTML = reportOptionDefinitions(typeSelect.value).map(([key, label, checked]) => `<label class="report-option"><input type="checkbox" data-report-option="${key}" ${checked ? 'checked' : ''} /><span>${esc(label)}</span></label>`).join('');
      optionsRoot.querySelectorAll('input').forEach(input => input.addEventListener('change', refreshReport));
    }

    function collectOptions() {
      const options = {};
      optionsRoot.querySelectorAll('[data-report-option]').forEach(input => { options[input.dataset.reportOption] = input.checked; });
      return options;
    }

    function refreshTargets() {
      targetSelect.innerHTML = reportTargetOptions(typeSelect.value);
      targetSelect.disabled = typeSelect.value === 'overall';
      renderOptions();
      refreshReport();
    }

    function refreshReport() {
      output.innerHTML = buildSelectedReport(typeSelect.value, targetSelect.value, collectOptions());
    }

    typeSelect.addEventListener('change', refreshTargets);
    targetSelect.addEventListener('change', refreshReport);
    document.getElementById('showReport').addEventListener('click', refreshReport);
    document.getElementById('printReport').addEventListener('click', () => {
      const options = collectOptions();
      refreshReport();
      printOfficialReport(typeSelect.value, targetSelect.value, options);
    });
    refreshTargets();
  }


  function renderSettings() {
    const methods = state.settings.deliveryMethods;
    main.innerHTML = `
      ${pageHead('الإعدادات', 'إعدادات المزاد وطرق الدفع والتوصيل والنسخ الاحتياطي')}
      <div class="grid grid-2">
        <section class="card"><div class="section-title"><h3>إعدادات عامة</h3></div><form id="settingsForm" class="form-grid">
          <div class="field full"><label>اسم المزاد</label><input name="auctionName" value="${esc(state.settings.auctionName)}" required /></div>
          <div class="field"><label>العملة</label><input name="currency" value="${esc(state.settings.currency)}" required /></div>
          <div class="field"><label>نوع العمولة الافتراضية</label><select name="defaultCommissionType"><option value="percent" ${state.settings.defaultCommissionType !== 'fixed' ? 'selected' : ''}>نسبة مئوية</option><option value="fixed" ${state.settings.defaultCommissionType === 'fixed' ? 'selected' : ''}>مبلغ ثابت</option></select></div>
          <div class="field"><label>قيمة العمولة الافتراضية</label><input name="defaultCommissionValue" type="number" inputmode="decimal" min="0" step="0.01" value="${num(state.settings.defaultCommissionValue != null ? state.settings.defaultCommissionValue : state.settings.defaultCommission)}" required data-select-on-focus /><small class="help">تُستخدم تلقائياً عند إنشاء بيعة جديدة ويمكن تغييرها داخل البيعة.</small></div>
          <div class="field"><label>عمولة بوابة الدفع الافتراضية %</label><input name="gatewayFeeRate" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="${num(state.settings.gatewayFeeRate)}" required /><small class="help">تضاف على المشتري ولا تدخل ضمن أرباح المزاد.</small></div>
          <div class="field full"><label>شعار المزاد</label><input name="logo" type="file" accept="image/*" /><small class="help">يفضل شعار مربع بحجم صغير.</small></div>
          <div class="field full"><div class="delivery-settings"><h4>طرق التوصيل والأطراف المستحقة</h4>
            <div class="delivery-setting-row pickup-row"><label><input name="pickupEnabled" type="checkbox" ${methods.pickup.enabled ? 'checked' : ''} /> استلام</label><input type="number" value="0" disabled /></div>
            <div class="delivery-setting-card"><label class="delivery-toggle"><input name="localEnabled" type="checkbox" ${methods.local.enabled ? 'checked' : ''} /> توصيل محلي</label><div class="form-grid"><div class="field"><label>الرسوم الافتراضية</label><input name="localFee" type="number" inputmode="decimal" min="0" step="0.01" value="${num(methods.local.fee)}" /></div><div class="field"><label>اسم شركة التوصيل</label><input name="localProviderName" value="${esc(methods.local.providerName || '')}" placeholder="شركة التوصيل المحلي" /></div></div></div>
            <div class="delivery-setting-card"><label class="delivery-toggle"><input name="internationalEnabled" type="checkbox" ${methods.international.enabled ? 'checked' : ''} /> شحن دولي</label><div class="form-grid"><div class="field"><label>الرسوم الافتراضية</label><input name="internationalFee" type="number" inputmode="decimal" min="0" step="0.01" value="${num(methods.international.fee)}" /></div><div class="field"><label>اسم شركة الشحن</label><input name="internationalProviderName" value="${esc(methods.international.providerName || '')}" placeholder="شركة الشحن الدولي" /></div></div></div>
            <small class="help">رسوم التوصيل والشحن تظهر كتزامات منفصلة للطرف الثالث في قسم التسويات.</small>
          </div></div>
          <div class="field full"><button class="primary" type="submit">حفظ الإعدادات</button></div>
        </form></section>
        <section class="card"><div class="section-title"><h3>النسخ الاحتياطي</h3></div><p class="text-muted">احتفظ بنسخة من البيانات خارج الهاتف بشكل دوري.</p><div class="list"><button class="primary" id="exportData">تصدير نسخة احتياطية</button><label class="secondary file-button">استعادة نسخة احتياطية<input id="importData" type="file" accept="application/json" class="hidden" /></label><button class="danger" id="resetData">حذف جميع البيانات</button></div></section>
      </div>`;
    document.getElementById('settingsForm').addEventListener('submit', saveSettings);
    document.getElementById('exportData').addEventListener('click', exportData);
    document.getElementById('importData').addEventListener('change', importData);
    document.getElementById('resetData').addEventListener('click', resetData);
  }

  function saveSettings(event) {
    event.preventDefault(); const form = event.currentTarget; const fd = new FormData(form);
    const enabled = [form.elements.pickupEnabled.checked, form.elements.localEnabled.checked, form.elements.internationalEnabled.checked];
    if (!enabled.some(Boolean)) return toast('يجب تفعيل طريقة توصيل واحدة على الأقل', 'error');
    if (form.elements.localEnabled.checked && !String(fd.get('localProviderName') || '').trim()) return toast('أدخل اسم شركة التوصيل المحلي', 'error');
    if (form.elements.internationalEnabled.checked && !String(fd.get('internationalProviderName') || '').trim()) return toast('أدخل اسم شركة الشحن الدولي', 'error');
    const apply = () => {
      state.settings.auctionName = fd.get('auctionName').trim(); state.settings.currency = fd.get('currency').trim();
      state.settings.defaultCommissionType = fd.get('defaultCommissionType') === 'fixed' ? 'fixed' : 'percent';
      state.settings.defaultCommissionValue = round(fd.get('defaultCommissionValue'));
      if (state.settings.defaultCommissionType === 'percent' && state.settings.defaultCommissionValue > 100) return toast('نسبة العمولة الافتراضية لا يمكن أن تتجاوز 100%', 'error');
      state.settings.defaultCommission = state.settings.defaultCommissionType === 'percent' ? state.settings.defaultCommissionValue : num(state.settings.defaultCommission);
      state.settings.gatewayFeeRate = round(fd.get('gatewayFeeRate'));
      state.settings.deliveryMethods = {
        pickup: { enabled: form.elements.pickupEnabled.checked, label: 'استلام', fee: 0, providerName: '' },
        local: { enabled: form.elements.localEnabled.checked, label: 'توصيل محلي', fee: round(fd.get('localFee')), providerName: String(fd.get('localProviderName') || '').trim() },
        international: { enabled: form.elements.internationalEnabled.checked, label: 'شحن دولي', fee: round(fd.get('internationalFee')), providerName: String(fd.get('internationalProviderName') || '').trim() }
      };
      persist('تم حفظ الإعدادات'); renderSettings();
    };
    const file = form.elements.logo.files[0];
    if (file) {
      if (file.size > 1024 * 1024) return toast('حجم الشعار يجب ألا يتجاوز 1 ميجابايت', 'error');
      const reader = new FileReader(); reader.onload = () => { state.settings.logo = reader.result; apply(); }; reader.readAsDataURL(file);
    } else apply();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const link = document.createElement('a');
    link.href = url; link.download = `auction-backup-${today()}.json`; link.click(); URL.revokeObjectURL(url); toast('تم إنشاء النسخة الاحتياطية');
  }

  function importData(event) {
    const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
    reader.onload = () => { try { const imported = JSON.parse(reader.result); if (!confirm('سيتم استبدال البيانات الحالية بالنسخة المختارة. هل تريد المتابعة؟')) return; state = Store.normalize(imported); persist('تمت استعادة النسخة الاحتياطية'); setView('dashboard'); } catch (error) { toast('ملف النسخة الاحتياطية غير صالح', 'error'); } }; reader.readAsText(file);
  }

  function resetData() {
    if (!confirm('تحذير: سيتم حذف جميع الجلسات والبيعات والعملاء والحركات. هل أنت متأكد؟')) return;
    if (!confirm('تأكيد أخير: لا يمكن التراجع بعد الحذف.')) return;
    state = Store.reset(); persist('تم حذف جميع البيانات'); setView('dashboard');
  }

  document.addEventListener('focusin', event => {
    const input = event.target.closest?.('[data-select-on-focus]');
    if (input && typeof input.select === 'function') requestAnimationFrame(() => input.select());
  });

  document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
  overlay.addEventListener('click', closeSidebar);
  document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
  document.getElementById('quickSaleBtn').addEventListener('click', () => {
    const openSessions = state.sessions.filter(x => x.status === 'open').sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!openSessions.length) { toast('أنشئ جلسة مفتوحة أولاً', 'error'); setView('sessions'); return; }
    if (openSessions.length === 1) { activeSessionId = openSessions[0].id; openSaleForm(activeSessionId); return; }
    modal({ title: 'اختر الجلسة', small: true, body: `<div class="list">${openSessions.map(session => `<button class="list-row selection-row" data-select-session="${session.id}"><span>${esc(session.name)}</span><small>${dateText(session.date)}</small></button>`).join('')}</div>`, onReady(root) { root.querySelectorAll('[data-select-session]').forEach(btn => btn.addEventListener('click', () => { activeSessionId = btn.dataset.selectSession; closeModal(); openSaleForm(activeSessionId); })); } });
  });

  window.addEventListener('error', event => {
    console.error(event.error || event.message);
    toast('حدث خطأ غير متوقع. لم يتم حذف أي بيانات.', 'error');
  });

  if (currentView === 'sessionDetails' && !getSession(activeSessionId)) { currentView = 'sessions'; activeSessionId = null; }
  if (!['dashboard', 'sessions', 'sessionDetails', 'customers', 'wallets', 'settlements', 'reports', 'settings'].includes(currentView)) currentView = 'dashboard';
  document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.view === (currentView === 'sessionDetails' ? 'sessions' : currentView)));
  localStorage.setItem(UI_KEY, JSON.stringify({ currentView, activeSessionId }));
  updateBrand();
  updateQuickSaleVisibility();
  render();
})();

</script>
  <script>
(function () {
  'use strict';

  const installButton = document.getElementById('installAppBtn');
  let deferredPrompt = null;
  let refreshing = false;
  let registrationRef = null;

  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  const isAndroidChrome = () => {
    const ua = navigator.userAgent || '';
    return /Android/i.test(ua) && /(Chrome|CriOS|EdgA)/i.test(ua);
  };

  function refreshInstallButton() {
    if (!installButton) return;
    if (isStandalone()) {
      hideInstallButton();
    } else {
      showInstallButton();
    }
  }

  function hideInstallButton() {
    if (installButton) installButton.classList.add('hidden');
  }

  function showInstallButton() {
    if (installButton && !isStandalone()) installButton.classList.remove('hidden');
  }

  function closeNotice() {
    document.getElementById('pwaNotice')?.remove();
  }

  function showNotice(title, message, actionLabel, onAction) {
    closeNotice();
    const notice = document.createElement('section');
    notice.id = 'pwaNotice';
    notice.className = 'pwa-notice';
    notice.setAttribute('role', 'status');
    notice.innerHTML = `
      <div><strong>${title}</strong><small>${message}</small></div>
      <div class="pwa-notice-actions">
        <button type="button" class="pwa-dismiss">لاحقاً</button>
        ${actionLabel ? `<button type="button" class="pwa-action">${actionLabel}</button>` : ''}
      </div>`;
    document.body.appendChild(notice);
    notice.querySelector('.pwa-dismiss').addEventListener('click', closeNotice);
    const action = notice.querySelector('.pwa-action');
    if (action && onAction) action.addEventListener('click', onAction);
  }

  async function requestInstall() {
    if (isStandalone()) {
      hideInstallButton();
      return;
    }
    if (!deferredPrompt) {
      const secureHint = window.isSecureContext
        ? ''
        : ' يجب فتح الموقع عبر HTTPS حتى يعمل تثبيت التطبيق.';
      const browserHint = isAndroidChrome()
        ? 'افتح قائمة Chrome ذات النقاط الثلاث ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». إذا كانت نسخة قديمة مثبتة، احذفها من الهاتف ثم أعد فتح الرابط.'
        : 'افتح الرابط في Google Chrome مباشرة، ثم من قائمة Chrome اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».';
      showNotice(
        'تثبيت تطبيق ركن الكهرم',
        browserHint + secureHint,
        '',
        null
      );
      return;
    }
    try {
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice?.outcome === 'accepted') hideInstallButton();
    } catch (error) {
      console.error('تعذر فتح نافذة تثبيت التطبيق', error);
    } finally {
      deferredPrompt = null;
    }
  }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredPrompt = event;
    refreshInstallButton();
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    hideInstallButton();
    showNotice('تم تثبيت التطبيق', 'يمكنك الآن فتح تطبيق ركن الكهرم من أيقونته دون شريط المتصفح.', '', null);
    window.setTimeout(closeNotice, 4500);
  });

  installButton?.addEventListener('click', requestInstall);
  refreshInstallButton();
  window.addEventListener('pageshow', refreshInstallButton);
  window.matchMedia('(display-mode: standalone)').addEventListener?.('change', refreshInstallButton);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./sw.js?v=13', { scope: './' });
        registrationRef = registration;

        if (registration.waiting && navigator.serviceWorker.controller) {
          showNotice('يتوفر تحديث للنظام', 'احفظ عملك ثم حدّث التطبيق للحصول على النسخة الجديدة.', 'تحديث الآن', () => {
            registration.waiting?.postMessage({ type: 'SKIP_WAITING' });
          });
        }

        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              showNotice('يتوفر تحديث للنظام', 'احفظ عملك ثم حدّث التطبيق للحصول على النسخة الجديدة.', 'تحديث الآن', () => {
                worker.postMessage({ type: 'SKIP_WAITING' });
              });
            }
          });
        });

        window.setTimeout(() => registration.update().catch(() => {}), 3000);
      } catch (error) {
        console.error('تعذر تسجيل خدمة التطبيق دون اتصال', error);
      }
    }, { once: true });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') registrationRef?.update().catch(() => {});
    });
  }

  window.addEventListener('online', () => {
    showNotice('عاد الاتصال بالإنترنت', 'تمت استعادة الشبكة ويمكن التحقق من تحديثات النظام.', '', null);
    window.setTimeout(closeNotice, 3200);
  });
})();

</script>
</body>
</html>
